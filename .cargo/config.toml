# 仓根统一构建产物落点：target-dir 指向源码区外（/tmp/rr3-build），
# 严禁在源码区内残留任何编译/集成/构建产物。/tmp 是 POSIX 标准临时目录，
# Windows 下按盘符根解析（如 D:\tmp\rr3-build）；整体覆盖可用
# CARGO_TARGET_DIR 环境变量（env 优先级高于 config）。
# cargo 自当前目录向上查找 .cargo/config.toml，故本配置对仓内所有
# workspace/crate 生效；子 workspace 若另设 [build] target-dir 则以近者为准。
[build]
target-dir = "/tmp/rr3-build"

# esp-idf 工具链装到用户级全局目录 ~/.espressif，不在 workspace 内重复下载。
# 注：`.embuild` 目录位置由 esp-idf-sys 按 workspace 根推导（0.35 无环境变量
# 覆盖点，2026-11-24 源码核对）；此前这里的 EMBUILD_ROOT 无人读取，已删除，
# 不再用死配置冒充"已移出源码区"。
[env]
ESP_IDF_TOOLS_INSTALL_DIR = "global"
