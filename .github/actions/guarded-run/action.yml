# guarded-run —— 把"命令失败 → 单行注解"的模板收成一处（2026-11-16 流水线治理）。
#
# 此前 platforms.yml 的六个 esp 门各自内联同一段 tee/grep/tr 模板：注解格式改一次要
# 改六处，漏改就让失败退化成 GitHub 上只有一句 "exit code 1"（根因不可见）。
# 本 action 是判据单点；调用方只给 title / prelude / command（策略面）。
name: guarded-run
description: 执行一条命令，失败时把日志里的错误行压成一条可归因的 GitHub 注解；仅网络镜像失败（502/504/下载失败）时按 15s 退避重试两次，代码/构建错误不重试
inputs:
  title:
    description: 注解标题（失败归因的锚，如 esp32-periph-base）
    required: true
  prelude:
    description: 命令前置脚本的绝对路径（如 esp 环境导出）；空 = 不前置
    required: false
    default: ""
  command:
    description: 要执行的命令（多行 shell 片段，经 bash -c 执行）
    required: true
runs:
  using: composite
  steps:
    - name: ${{ inputs.title }}
      shell: bash
      env:
        GUARDED_TITLE: ${{ inputs.title }}
        GUARDED_PRELUDE: ${{ inputs.prelude }}
        GUARDED_CMD: ${{ inputs.command }}
      run: |
        set -o pipefail
        log="${RUNNER_TEMP:-/tmp}/guarded-${GUARDED_TITLE}.log"
        if [ -n "${GUARDED_PRELUDE}" ]; then
          # `~/` 由调用方书写（GitHub 输入不做 shell 展开），这里补成 $HOME。
          pre="${GUARDED_PRELUDE/#\~/$HOME}"
          # shellcheck disable=SC1090
          . "${pre}"
        fi
        run_guarded() {
          bash -c "${GUARDED_CMD}" 2>&1 | tee "${log}"
        }
        if ! run_guarded; then
          # 网络镜像抖动（rsproxy 502/504）与代码错误分开处置：仅当日志命中网络
          # 标记时按 15s 退避重试两次（2026-11-24 实测单次重试仍撞上 504）；
          # 代码/构建错误照旧当场红，不掩盖根因。
          if grep -qiE 'spurious network error|Gateway Time-out|Bad Gateway|failed to download' "${log}"; then
            for attempt in 1 2; do
              echo "::warning title=${GUARDED_TITLE}::网络镜像失败，第 ${attempt}/2 次重试（15s 退避）"
              sleep 15
              if run_guarded; then
                exit 0
              fi
              if ! grep -qiE 'spurious network error|Gateway Time-out|Bad Gateway|failed to download' "${log}"; then
                break
              fi
            done
          fi
          # 取错误行连同后 3 行上下文（rustc 的 `-->` 位置与 expected/found 在
          # 后两行；只抓 error 行会退化成"mismatched types 盲猜"，2026-11-19 实测）。
          errs="$(grep -A3 -iE 'error(\[|:)|^FAIL|错误|failed' "${log}" | head -60 | tr '\n' ' ' | tr -s ' ')"
          echo "::error title=${GUARDED_TITLE}::${errs:0:900}"
          exit 1
        fi
