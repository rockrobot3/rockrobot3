# Buildroot 出厂轨构建门（M1 构建半边，2026-11-16 立）。
#
# 为什么单独一条流水线：全量 Buildroot 构建是小时级重活，不能塞进每次 push 的
# 通用门禁；但"配置是否真能构建"又必须由 CI 给回执，不能靠本机 macOS 推断。
# 本文件先交**板级 dts 回移的编译回执**（Linux 6.6 + v6.12 dts 回移补丁），
# 通过后再接全量镜像 job（同一触发面，届时只加 job 不改判据）。
#
# 触发面：改动 buildroot 轨或本文件即跑；也可 workflow_dispatch 手动触发。
name: buildroot

on:
  push:
    branches: [main, "dev/**"]
    # 发布面（ADR-0028）：v* 标签走全量构建 + release job 签名/推送 ghcr。
    # 标签推送不做路径过滤（GitHub 对 tag push 不评估 paths）。
    tags: ["v*"]
    paths:
      - "base/os/buildroot/**"
      - ".github/workflows/buildroot.yml"
  workflow_dispatch:
    inputs:
      tag:
        description: "手输标签（发布腿直接采用，如 0.0.8 或 edge）"
        required: false
        default: edge

permissions:
  contents: read

concurrency:
  group: buildroot-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  LINUX_VER: "6.6"
  PATCH: base/os/buildroot/board/radxa-zero3/patches/0001-arm64-dts-rockchip-add-radxa-zero-3.patch

jobs:
  dtb-backport:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: 安装内核 dts 构建依赖
        uses: ./.github/actions/apt-retry
        with:
          packages: gcc-aarch64-linux-gnu bc bison flex libssl-dev
          title: apt-dtb
          log: apt-dtb

      - name: dts 工具链在位
        run: command -v aarch64-linux-gnu-gcc

      # 内核 tarball（~140MB）按版本钉 key 缓存：dtb 门每次跑都要源码，重复
      # 下载是本 job 主要网络耗时（2026-11-17 治理）；解包+补丁每拍重做——
      # 秒级、确定性，补丁只打在解包后的新树上，缓存永远是无补丁的原包。
      - name: 恢复内核源码包缓存
        id: linux-src
        uses: actions/cache@v5
        with:
          path: /tmp/linux.tar.xz
          key: linux-${{ env.LINUX_VER }}-source-v1
      - name: 取 Linux 6.6 源码并应用 Radxa ZERO 3 回移补丁
        run: |
          set -o pipefail
          if [ ! -s /tmp/linux.tar.xz ]; then
            if ! curl -fL --retry 3 --retry-delay 2 -o /tmp/linux.tar.xz \
                "https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-${LINUX_VER}.tar.xz"; then
              echo "::error title=kernel-fetch::Linux ${LINUX_VER} 源码下载失败"
              exit 1
            fi
          fi
          tar -xJf /tmp/linux.tar.xz -C /tmp
          src="/tmp/linux-${LINUX_VER}"
          # 用 git apply 而不是 patch：本补丁三件是纯新增文件、Makefile 是纯插入
          # hunk——GNU patch 对纯插入 hunk 即使上下文逐字命中也会报 "with fuzz 1"
          # （2026-11-24 用 2.7.6 实测复现），于是旧告警永远响、无法当信号用。
          # git apply 严格比对上下文（--check 同判据），偏移/漂移即红，不打补丁。
          patch_abs="$PWD/$PATCH"
          if ! ( cd "$src" && git apply --check -p1 "$patch_abs" ) > /tmp/patch.log 2>&1; then
            echo "::error title=dts-patch::回移补丁上下文不匹配（git apply --check 拒绝）"
            tail -8 /tmp/patch.log
            exit 1
          fi
          ( cd "$src" && git apply -p1 "$patch_abs" ) >> /tmp/patch.log 2>&1
          grep -nE "radxa-zero-3[ew]" "$src/arch/arm64/boot/dts/rockchip/Makefile"

      - name: 构建两个变体的 dtb（6.6 基线）
        run: |
          set -o pipefail
          src="/tmp/linux-${LINUX_VER}"
          make -C "$src" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- defconfig >/dev/null
          if ! grep -q "^CONFIG_ARCH_ROCKCHIP=y" "$src/.config"; then
            "$src/scripts/config" --file "$src/.config" --enable ARCH_ROCKCHIP
          fi
          make -C "$src" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig >/dev/null
          if ! make -C "$src" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j"$(nproc)" \
              rockchip/rk3566-radxa-zero-3w.dtb rockchip/rk3566-radxa-zero-3e.dtb > /tmp/dtb.log 2>&1; then
            echo "::error title=dtb-build::dtb 构建失败（见日志摘要）"
            grep -iE "error|Error|fatal" /tmp/dtb.log | tail -8
            exit 1
          fi
          for b in rk3566-radxa-zero-3w.dtb rk3566-radxa-zero-3e.dtb; do
            f="$src/arch/arm64/boot/dts/rockchip/$b"
            [ -s "$f" ] || { echo "::error title=dtb-missing::$b 未生成"; exit 1; }
            printf 'PASS  %s %s bytes\n' "$b" "$(stat -c%s "$f")"
            file "$f"
          done
          echo "PASS  Linux ${LINUX_VER} + v6.12 板级 dts 回移：两个变体 dtb 构建通过"

  # 全量镜像（M1 构建半边）：小时级重活，只在显式提交信息带 [buildroot-full] 或
  # workflow_dispatch 时跑；日常 buildroot 改动只跑上面的 dtb 门。
  image:
    needs: dtb-backport
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message || '', '[buildroot-full]')
    # 2026-11-16 实测：ubuntu-latest（GCC 14）构建 Buildroot 2024.02.11 的
    # host-m4 1.4.19 时 gnulib gl_oset.h 编译失败（expected identifier before 'int'）。
    # Buildroot 2024.02 的受支持宿主是 Ubuntu 22.04；钉 22.04 而不是给 host-m4
    # 打补丁——宿主工具链错配是根因，补丁只是掩盖。
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7

      - name: 释放磁盘（Buildroot 全量构建）
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          df -h /

      - name: 安装 Buildroot 宿主依赖
        uses: ./.github/actions/apt-retry
        with:
          packages: build-essential git wget cpio unzip rsync bc bison flex libssl-dev libncurses-dev python3 file
          title: br-deps
          log: br-deps

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.100.0"
          # musl：五件静态产物；gnu：brain 用 Buildroot 自带 glibc 工具链交叉构建
          # （批320——宿主 apt gcc 的 glibc 比镜像新，产出的 brain 会 GLIBC_2.x 拒启）。
          targets: aarch64-unknown-linux-musl, aarch64-unknown-linux-gnu

      - name: 取 Buildroot 2024.02.11 并叠 configs/board
        run: |
          set -o pipefail
          ok=0
          for _ in 1 2 3; do
            rm -rf /tmp/buildroot
            if git clone --depth 1 --branch 2024.02.11 \
                https://github.com/buildroot/buildroot.git /tmp/buildroot; then
              ok=1
              break
            fi
            sleep 3
          done
          if [ "$ok" != 1 ]; then
            echo "::error title=br-clone::Buildroot 2024.02.11 clone 失败"
            exit 1
          fi
          cp -a base/os/buildroot/configs/. /tmp/buildroot/configs/
          cp -a base/os/buildroot/board/. /tmp/buildroot/board/
          ls /tmp/buildroot/configs/rock3_zero3_defconfig /tmp/buildroot/board/radxa-zero3/patches/

      # 只缓存下载面（DL_DIR）：包源码 + custom git（U-Boot/rkbin）。输出树不缓存
      # ——半成品 O= 树跨拍复用会把"上一拍失败的残骸"带进下一拍，是假绿的经典来源。
      # key 含 Buildroot 版本与 defconfig 哈希；restore-keys 允许同版本配置变更后
      # 复用仍然有效的包源码（Buildroot 对每个包自带 hash/revision 校验）。
      - name: 恢复 Buildroot 下载缓存
        uses: actions/cache@v5
        with:
          path: /tmp/buildroot/dl
          key: br-dl-2024.02.11-${{ hashFiles('base/os/buildroot/configs/rock3_zero3_defconfig') }}
          restore-keys: |
            br-dl-2024.02.11-

      # 交叉构建失败极少是环境问题，多是本仓代码/特性组合问题：日志归因交给
      # tools/ci/lib/log-digest.sh 的单点口径（与 br-* 各步同一套噪音过滤）。
      - name: 交叉构建注入产物（aarch64-musl 静态）
        run: |
          set -o pipefail
          if ! bash tools/ci/platform/cross-artifacts.sh aarch64-unknown-linux-musl \
              'ARM aarch64' static > /tmp/stage-build.log 2>&1; then
            bash tools/ci/lib/log-digest.sh --title stage-build --log /tmp/stage-build.log --tail 8
            exit 1
          fi

      - name: 注入 BINARIES_DIR（rrd / rr3-ctl / rr3-ota-ctl / 五模块 / 宿主 rr3-pack；brain 另步随镜像同源工具链）
        run: |
          set -euo pipefail
          rel=/tmp/rr3-build/aarch64-unknown-linux-musl/release
          mkdir -p /tmp/br-out/images/rr3-modules
          install -m 0755 "$rel/rrd" /tmp/br-out/images/rrd
          install -m 0755 "$rel/rr3-ctl" /tmp/br-out/images/rr3-ctl
          install -m 0755 "$rel/rr3-ota-ctl" /tmp/br-out/images/rr3-ota-ctl
          # post-build.sh 只调 rr3-pack 做模块/真值集装配：打包器必须是宿主原生
          # （aarch64 产物跑不了），单独 target-dir 不与交叉树混。
          CARGO_TARGET_DIR=/tmp/rr3-build-pack \
            cargo build -q --locked --release --manifest-path tools/rr3-pack/Cargo.toml
          install -m 0755 /tmp/rr3-build-pack/release/rr3-pack /tmp/br-out/images/rr3-pack
          for m in act connect interact sense power; do
            d=/tmp/br-out/images/rr3-modules/rr3-$m
            mkdir -p "$d"
            install -m 0755 "$rel/rr3-$m" "$d/bin"
            install -m 0644 "modules/rr3-$m/module.toml" "$d/manifest.toml"
          done
          find /tmp/br-out/images -maxdepth 3 -type f | head -20

      - name: 应用 defconfig
        run: |
          set -o pipefail
          # BR2_DL_DIR 显式钉到缓存目录：O= 输出树下的默认 dl 路径与预置点
          # 不一致时，Buildroot 会重下（2026-11-16 实测）。
          if ! make -C /tmp/buildroot O=/tmp/br-out BR2_DL_DIR=/tmp/buildroot/dl \
              rock3_zero3_defconfig > /tmp/br-defconfig.log 2>&1; then
            bash tools/ci/lib/log-digest.sh --title br-defconfig --log /tmp/br-defconfig.log --tail 8
            exit 1
          fi

      # U-Boot 单包先跑：2026-11-17 全量构建在 uboot 阶段失败，而失败注解被
      # "pyerrors.h" 这类含 error 的路径污染，根因读不出来。这一拍把失败面
      # 锁到 U-Boot，失败时交给 log-digest 归因（噪音过滤口径单点）。
      - name: 预构建 U-Boot（快速定位）
        run: |
          set -o pipefail
          # -j 必须带上：单线程跑 host-python/host-dtc/ATF/U-Boot 要小时级，
          # 诊断拍的价值就在"快失败"。
          if ! make -C /tmp/buildroot O=/tmp/br-out BR2_DL_DIR=/tmp/buildroot/dl \
              -j"$(nproc)" uboot > /tmp/br-uboot.log 2>&1; then
            # dtc 版本是 scripts_dtc 失败的第一现场：缺文件/版本过旧都在这里现形。
            dtc_v=$([ -x /tmp/br-out/host/bin/dtc ] && /tmp/br-out/host/bin/dtc -v 2>&1 | head -1 || echo MISSING)
            bash tools/ci/lib/log-digest.sh --title br-uboot --log /tmp/br-uboot.log \
              --tail 80 --note "dtc=${dtc_v}"
            exit 1
          fi
          tail -3 /tmp/br-uboot.log

      # brain 与镜像同源工具链（批320）：distro 装配单 enabled_slots 含 rr3-brain，
      # 而 aarch64-musl 交叉面因 ring 需目标 C 工具链不含它——镜像此前只装五模块，
      # 开机必有一条 "manifest 读取失败" 拒绝启动。这里用 Buildroot 自带的 glibc
      # 交叉 gcc 构建 brain（与镜像 glibc 同一份，避免宿主 apt gcc 的 GLIBC_2.x
      # 过新）；`make toolchain` 是幂等的（U-Boot 预构建已把工具链拉起来），随后
      # 全量 make 从该状态续建，不重复构建。
      - name: 预构建 Buildroot 工具链（brain 交叉前件）
        run: |
          set -o pipefail
          if ! make -C /tmp/buildroot O=/tmp/br-out BR2_DL_DIR=/tmp/buildroot/dl \
              -j"$(nproc)" toolchain > /tmp/br-toolchain.log 2>&1; then
            bash tools/ci/lib/log-digest.sh --title br-toolchain --log /tmp/br-toolchain.log --tail 30
            exit 1
          fi
          tail -3 /tmp/br-toolchain.log

      - name: 交叉构建 brain（Buildroot 工具链，与镜像 glibc 同源）并入 payload
        run: |
          set -o pipefail
          host=/tmp/br-out/host
          cc="$host/bin/aarch64-buildroot-linux-gnu-gcc"
          ar="$host/bin/aarch64-buildroot-linux-gnu-ar"
          for t in "$cc" "$ar"; do
            [ -x "$t" ] || { echo "::error title=br-brain::缺 $t（工具链未就绪）"; exit 1; }
          done
          if ! CC_aarch64_unknown_linux_gnu="$cc" AR_aarch64_unknown_linux_gnu="$ar" \
               CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER="$cc" \
               cargo build --locked --release --target aarch64-unknown-linux-gnu \
                 --manifest-path modules/rr3-brain/Cargo.toml > /tmp/br-brain.log 2>&1; then
            bash tools/ci/lib/log-digest.sh --title br-brain --log /tmp/br-brain.log --tail 20
            exit 1
          fi
          bin=/tmp/rr3-build/aarch64-unknown-linux-gnu/release/rr3-brain
          [ -x "$bin" ] || { echo "::error title=br-brain::产物不在树 $bin"; exit 1; }
          file "$bin"
          d=/tmp/br-out/images/rr3-modules/rr3-brain
          mkdir -p "$d"
          install -m 0755 "$bin" "$d/bin"
          install -m 0644 modules/rr3-brain/module.toml "$d/manifest.toml"
          echo "PASS  brain 交叉构建（Buildroot 工具链）并入 payload"

      - name: 全量构建（make）
        env:
          RR3_REPO_ROOT: ${{ github.workspace }}
        run: |
          set -o pipefail
          if ! make -C /tmp/buildroot O=/tmp/br-out BR2_DL_DIR=/tmp/buildroot/dl \
              -j"$(nproc)" > /tmp/br-build.log 2>&1; then
            # 阶段推进（末 3 条 `>>>`）与信号行一起进注解；genimage/post-image
            # 的失败只报 target-post-image Error 1，真因在末段，故回显 40 行。
            bash tools/ci/lib/log-digest.sh --title br-build --log /tmp/br-build.log \
              --phases --tail 40
            exit 1
          fi
          tail -5 /tmp/br-build.log

      # 内容在位不等于能跑（批328）：brain 是 post-build 注入、不在 Buildroot 包图里，
      # 而 Rust gnu 产物动态链 libc/libgcc_s 并依赖 ELF interpreter——库缺位只有真板
      # 启动才会暴露。这里在目标根上做 NEEDED + interpreter 齐套判据：readelf 读产物，
      # find 在 /tmp/br-out/target 找同名件（镜像由该根生成）。
      - name: brain 动态依赖在目标根齐套
        run: |
          set -euo pipefail
          bin=/tmp/rr3-build/aarch64-unknown-linux-gnu/release/rr3-brain
          [ -x "$bin" ] || { echo "::error title=br-brain-deps::产物不在树 $bin"; exit 1; }
          interp=$(readelf -l "$bin" | sed -n 's/.*interpreter: \(.*\)\]/\1/p')
          [ -n "$interp" ] || { echo "::error title=br-brain-deps::readelf 读不到 ELF interpreter"; exit 1; }
          [ -e "/tmp/br-out/target$interp" ] || {
            echo "::error title=br-brain-deps::目标根缺 interpreter $interp（brain 无法加载）"
            exit 1
          }
          echo "PASS  interpreter $interp"
          needed=$(readelf -d "$bin" | sed -n 's/.*NEEDED.*\[\(.*\)\]/\1/p')
          [ -n "$needed" ] || { echo "::error title=br-brain-deps::readelf 无 NEEDED（产物形态异常）"; exit 1; }
          for lib in $needed; do
            hit=$(find /tmp/br-out/target -name "$lib" -print -quit)
            if [ -z "$hit" ]; then
              echo "::error title=br-brain-deps::目标根缺 $lib（brain 起到一半会因动态链接失败）"
              exit 1
            fi
            echo "PASS  $lib → ${hit#/tmp/br-out/target}"
          done

      # 加载自证（批333）：依赖件齐套只证明"文件在"，不证明加载器接得上。brain 没有
      # CLI 参数面，起手先打版本行再连总线；用 qemu-aarch64 以目标根为 sysroot 直接
      # 执行，判据 = 版本行出现且无加载器错误。无总线按预期非 0 退出，不以退出码冒充
      # 功能运行；系统级启动仍归真板/QEMU 整机窗口。
      - name: brain 加载自证（qemu-aarch64，目标根 sysroot）
        run: |
          set -euo pipefail
          bin=/tmp/br-out/target/usr/lib/rockrobot3/modules/rr3-brain/rr3-brain
          [ -x "$bin" ] || { echo "::error title=br-brain-run::目标根缺 $bin"; exit 1; }
          if ! command -v qemu-aarch64-static >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq qemu-user-static >/dev/null
          fi
          rc=0
          RR3_BUS_PATH=/tmp/rr3-no-bus.sock \
            qemu-aarch64-static -L /tmp/br-out/target "$bin" > /tmp/brain-run.log 2>&1 || rc=$?
          cat /tmp/brain-run.log
          if grep -qiE 'error while loading shared libraries|cannot open shared object' /tmp/brain-run.log; then
            echo "::error title=br-brain-run::动态加载失败（依赖件在位但加载器接不上）"
            exit 1
          fi
          grep -q 'rr3-brain 0\.0\.1' /tmp/brain-run.log || {
            echo "::error title=br-brain-run::未打印版本行（二进制未真正执行，rc=${rc}）"
            exit 1
          }
          echo "PASS  brain 在目标根下可加载并进入启动序列（rc=${rc}，无总线按预期退出）"

      - name: 上传构建日志（失败时）
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: buildroot-logs
          path: |
            /tmp/br-defconfig.log
            /tmp/br-uboot.log
            /tmp/br-build.log
          if-no-files-found: ignore
          retention-days: 7

      # 镜像名真值在 genimage.cfg（`image <名>.img`），CI 不写第二份字面量：
      # 2026-11-17 审计发现旧断言硬写 sdcard.img，而 genimage 实际产出
      # rock3-zero3.img——即使全量 make 成功也会在断言步假红。
      - name: 解析镜像名（genimage.cfg 单点）
        id: img
        run: |
          set -euo pipefail
          name=$(awk '$1=="image" && $2 ~ /\.img$/ { print $2; exit }' \
            base/os/buildroot/board/radxa-zero3/genimage.cfg)
          if [ -z "$name" ]; then
            echo "::error title=br-image-name::genimage.cfg 找不到顶层 .img 声明"
            exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "PASS  镜像名解析：$name"

      - name: 镜像产物断言（GPT 分区 + dtb）
        run: |
          set -euo pipefail
          img="/tmp/br-out/images/${{ steps.img.outputs.name }}"
          if [ ! -s "$img" ]; then
            echo "::error title=br-image::${{ steps.img.outputs.name }} 未生成"
            ls -l /tmp/br-out/images | head
            exit 1
          fi
          ls -l "$img"
          sha256sum "$img"
          sfdisk -d "$img" > /tmp/br-parts.txt || {
            echo "::error title=br-part::sfdisk 读不出分区表"
            exit 1
          }
          # 分区名是 rr-ota 槽位标签的物理对应物：名字漂移 = 升级链错槽。
          for p in boot rr_a rr_b rr_factory rr_staging data; do
            if ! grep -q "name=\"$p\"" /tmp/br-parts.txt; then
              echo "::error title=br-part::GPT 缺分区 $p"
              cat /tmp/br-parts.txt
              exit 1
            fi
            echo "PASS  GPT 分区 $p"
          done
          for b in rk3566-radxa-zero-3w.dtb rk3566-radxa-zero-3e.dtb; do
            if [ ! -s "/tmp/br-out/images/$b" ]; then
              echo "::error title=br-dtb::$b 不在 images"
              exit 1
            fi
            echo "PASS  $b"
          done
          echo "PASS  Buildroot 2024.02.11 全量构建：${{ steps.img.outputs.name }} 产出"

      # 只读内容断言：genimage 成功不等于分区内容对。判据体在
      # tools/ci/platform/buildroot-image-check.sh（e2fsck / 标签 / rootfs 内容 /
      # FIT 与 TPL 四组，2026-11-27 批130 从 workflow 内联 57 行收为脚本）。
      - name: 镜像内容只读断言（ext4 / fstab / FIT）
        run: bash tools/ci/platform/buildroot-image-check.sh

      - name: 生成摘要清单
        run: |
          set -euo pipefail
          cd /tmp/br-out/images
          sha256sum "${{ steps.img.outputs.name }}" ./*.ext4 ./*.dtb > checksums.txt
          cat checksums.txt

      # 产物留档是为了让 OTA 签名链有**真实载体**可签（tag/发布面消费），
      # 不是演示下载；保留 14 天与一次全量构建的复核窗口同档。
      - name: 上传镜像与摘要
        uses: actions/upload-artifact@v7
        with:
          name: rock3-zero3-image
          path: |
            /tmp/br-out/images/${{ steps.img.outputs.name }}
            /tmp/br-out/images/*.ext4
            /tmp/br-out/images/*.dtb
            /tmp/br-out/images/checksums.txt
          if-no-files-found: error
          retention-days: 14

  # 发布面（ADR-0028）：只在 v* 标签上签名并推送 ghcr。
  # 机制在 tools/deploy/ota-bundle.sh（规范名 → manifest → 签名 → 公钥复验 →
  # 摘要），本 job 只做触发/密钥/不可变策略；私钥只落 0600 临时文件并在
  # always 步删除，不打印、不进 artifact。无 Secret 即失败，无跳过开关。
  release:
    needs: image
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: rock3-zero3-image
          path: /tmp/rr3-release
      - name: 复核 artifact 摘要
        run: |
          set -euo pipefail
          cd /tmp/rr3-release
          sha256sum -c checksums.txt
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.100.0"
      - name: 构建 rr3-ota-ctl（宿主机）
        run: |
          set -o pipefail
          if ! cargo build -q --locked --release \
               --manifest-path base/ota/rr3-ota-ctl/Cargo.toml 2>&1 | tee /tmp/ota-build.log; then
            bash tools/ci/lib/log-digest.sh --title ota-build --log /tmp/ota-build.log --tail 12
            exit 1
          fi
      - name: 版本与密钥前置（fail-closed）
        env:
          KEY_HEX: ${{ secrets.RR3_OTA_SIGNING_KEY }}
        run: |
          set -euo pipefail
          # 正式制品只认 vX.Y.Z：release-tag.sh 已核"tag 与 VERSION 同源且指向 release 提交"，
          # 这里的形状门再把 rc 预发布挡在签名发布之外。
          meta="$(bash tools/ci/lib/release-tag.sh "${GITHUB_EVENT_NAME}" "${GITHUB_REF}" "${GITHUB_REF_NAME}" "${{ inputs.tag }}")"
          tag="$(printf '%s\n' "$meta" | sed -n 's/^tag=//p')"
          ver="$(printf '%s\n' "$meta" | sed -n 's/^version=//p')"
          if ! printf '%s' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error title=ota-version::标签 ${tag} 不是 v<major.minor.patch>"
            exit 1
          fi
          if [ -z "${KEY_HEX:-}" ]; then
            echo "::error title=ota-key::Secret RR3_OTA_SIGNING_KEY 未配置（tag 发布必须签名，无回退）"
            exit 1
          fi
          if ! printf '%s' "$KEY_HEX" | grep -Eq '^[0-9a-fA-F]{64}$'; then
            echo "::error title=ota-key::Secret 不是 64 位十六进制种子"
            exit 1
          fi
          echo "VER=$ver" >> "$GITHUB_ENV"
          umask 077
          printf '%s\n' "$KEY_HEX" >"$RUNNER_TEMP/rr3-ota.key"
          chmod 600 "$RUNNER_TEMP/rr3-ota.key"
      - name: 组包 / 签名 / 自复验
        run: |
          set -euo pipefail
          RR3_OTA_CTL=/tmp/rr3-build/release/rr3-ota-ctl \
            bash tools/deploy/ota-bundle.sh \
              --image /tmp/rr3-release/rr_a.ext4 \
              --version "$VER" \
              --key-file "$RUNNER_TEMP/rr3-ota.key" \
              --out /tmp/rr3-ota-bundle
      - name: 清理私钥
        if: always()
        run: rm -f "$RUNNER_TEMP/rr3-ota.key"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: oras-project/setup-oras@v2
      - name: 不可变标签检查 + 推送 ghcr
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER}"
          # tag 统一 v<VER>：与运行镜像/固件同一口径（v0.0.8 首发时此处曾漏 v，
          # 该版制品以 0.0.8 名留存；向后统一）。
          ota="ghcr.io/${owner}/rockrobot3-ota:v${VER}"
          build="ghcr.io/${owner}/rockrobot3-buildroot:v${VER}"
          for ref in "$ota" "$build"; do
            if out=$(oras manifest fetch "$ref" 2>&1); then
              echo "::error title=ota-immutable::已存在：$ref（拒绝覆盖）"
              exit 1
            fi
            if ! printf '%s' "$out" | grep -qiE 'not found|404|manifest unknown'; then
              echo "::error title=ota-immutable::读 $ref 失败且非 404：${out:0:400}"
              exit 1
            fi
          done
          cd /tmp/rr3-ota-bundle
          img="rr3-rootfs-rk3566-${VER}.img"
          pub=$(sed -n 's/^pub=//p' bundle.txt)
          oras push "$ota" \
            --artifact-type application/vnd.rr3.ota.bundle.v1+json \
            "${img}:application/octet-stream" \
            "${img}.manifest:application/octet-stream" \
            "${img}.sig:application/octet-stream" \
            "${pub}:application/octet-stream" \
            "checksums.txt:text/plain" \
            "bundle.txt:text/plain"
          echo "PASS  已推送 $ota"
          cd /tmp/rr3-release
          oras push "$build" \
            --artifact-type application/vnd.rr3.buildroot.image.v1+json \
            "rock3-zero3.img:application/octet-stream" \
            "rk3566-radxa-zero-3w.dtb:application/vnd.device-tree+octet-stream" \
            "rk3566-radxa-zero-3e.dtb:application/vnd.device-tree+octet-stream" \
            "checksums.txt:text/plain"
          echo "PASS  已推送 $build"
          oras manifest fetch "$ota" >/dev/null
          oras manifest fetch "$build" >/dev/null
          echo "PASS  ghcr 两个制品可读"
      # 本流水线产出两类（OTA/buildroot）的成员判据与镜像腿同源（批179）：推完即按
      # release-verify 的数据表回读，缺层/标签写法漂移当场红。
      - name: 发布面齐套（本流水线：OTA + buildroot）
        run: >-
          bash tools/ci/lib/release-verify.sh --tag "v${VER}"
          --repo "${{ github.repository }}" --classes ota,buildroot
      - name: job summary
        if: always()
        run: |
          {
            echo "## OTA release"
            echo "- tag: ${GITHUB_REF_NAME}"
            echo "- version: ${VER:-?}"
            echo "- key_id: $(sed -n 's/^key_id=//p' /tmp/rr3-ota-bundle/bundle.txt 2>/dev/null || echo '缺')"
            echo "- OTA: ghcr.io/${GITHUB_REPOSITORY_OWNER}/rockrobot3-ota:v${VER:-?}"
            echo "- buildroot: ghcr.io/${GITHUB_REPOSITORY_OWNER}/rockrobot3-buildroot:v${VER:-?}"
          } >>"$GITHUB_STEP_SUMMARY"
