# CI 单一事实源（R30 裁定，2026-10-11）：atomgit 无流水线功能（用户裁定），CI
# 流水线改走 GitHub Actions——R27 时代的 .gitcode/workflows/ 单真源路径作废，
# .gitcode/ 已删除，真源回归本文件。改 CI 只改本文件。GitHub 仓库待建+SSH key
# 待配，推送后触发八 job 首跑（回执核对见 docs/status.md 敞口表第 1 条）。
name: ci
on:
  push:
    branches: [main, "dev/**"]
  pull_request:
  # 重工具链 ESP 档按需触发（冷跑含 ESP-IDF 工具链安装，不随每次 dev 推送跑账）
  workflow_dispatch:

jobs:
  # 规约门禁（十步）：本地与 CI 同一入口（docs/process/conventions.md §2）。
  conventions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # ⑨-y 跨平台可编面的前件（批N8 件六）：门内不设 SKIP，target 缺位即红
      - name: 安装 Windows target（⑨-y 门前置）
        run: rustup target add x86_64-pc-windows-msvc
      - name: 规约门禁检查（check.sh 全步，含 ⑫ 质量度量）
        run: bash tools/ci/check.sh

  # 门禁之外的 lint 拆步：fmt 与 clippy 各自独立失败，一步红即整 job 红，
  # 失败归因不用翻混合日志。绿色基线 = 提交 fd0942c（rustfmt 全仓归一 + clippy 清零）。
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: base/runtime
      - name: rustfmt --check（base/runtime + 全部独立工程）
        run: |
          cargo fmt --manifest-path base/runtime/Cargo.toml --all -- --check
          while IFS= read -r -d '' m; do
            cargo fmt --manifest-path "$m" -- --check
          done < <(find modules tools base/ota -name Cargo.toml \
                     -not -path "*/target/*" -not -path "base/runtime/*" -print0 | sort -z)
      - name: clippy -D warnings（base/runtime + 全部独立工程）
        run: |
          cargo clippy -q --all-targets --manifest-path base/runtime/Cargo.toml --workspace -- -D warnings
          while IFS= read -r -d '' m; do
            cargo clippy -q --all-targets --manifest-path "$m" -- -D warnings
          done < <(find modules tools base/ota -name Cargo.toml \
                     -not -path "*/target/*" -not -path "base/runtime/*" \
                     -not -path "tools/esp32-uart-echo/*" -not -path "tools/espidf-std-hello/*" \
                     -not -path "tools/espidf-sentinel/*" -not -path "tools/esp32-periph-base/*" \
                     -print0 | sort -z)
        # esp 工程的排除与门禁 ④ 同口径：xtensa/espidf 专用工具链工程，宿主 stable
        # clippy 必红，编译执法在专用门（esp-uart-echo-check.sh / espidf-std-check.sh /
        # espidf-sentinel-check.sh / esp32-periph-base-check.sh / rr3-act-sense-espidf-check.sh，
        # SKIP 纪律）；fmt 步不编译，对它们照跑。modules/rr3-act、rr3-sense 是双档
        # 工程（批N8 件三）：宿主 linux 档照常进本 lint 步与门禁 ④/⑥（不整目录排除），
        # espidf 档归专用门。

  # IPC-T-003 跨架构对拍（ADR-0006 后果项，平台条件脚本——不进门禁步序，
  # 但 ubuntu runner 恰好具备全部平台条件：x86_64 宿主 + QEMU arm64 仿真 +
  # Docker + espup 装的 esp 工具链（第④路 xtensa 对拍））。--strict：任何
  # 一步 SKIP 即不放行（退 2）。
  # QEMU 仿真下容器内 cargo 构建较慢属预期；rust-cache 与 conventions/lint 共享加速。
  ipct003:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: base/runtime
      - uses: docker/setup-qemu-action@v3
      - name: 安装 esp 工具链（espup 预编译直下 → +esp，第④路 xtensa 对拍）
        run: |
          # 钉版 v0.17.1（2026-04-17 发布）——latest 漂移会破工具链可重现性；
          # 升级方式：核对 esp-rs/espup release 资产名后改此处版本号
          mkdir -p "$HOME/.local/bin"
          curl -fsSL https://github.com/esp-rs/espup/releases/download/v0.17.1/espup-x86_64-unknown-linux-gnu \
            -o "$HOME/.local/bin/espup"
          chmod +x "$HOME/.local/bin/espup"
          "$HOME/.local/bin/espup" install --targets esp32
      - name: IPC-T-003 跨架构对拍（--strict）
        run: |
          # espup 生成的环境导出（LIBCLANG_PATH 等）供 +esp 工具链取用
          # shellcheck disable=SC1091
          [ -f "$HOME/export-esp.sh" ] && . "$HOME/export-esp.sh"
          bash tools/ci/ipct003.sh --strict

  # 重工具链 ESP 构建档（A 任务构建面）：espup 钉版 v0.17.1 + ESP-IDF v5.2.2 克隆 +
  # 乐鑫 esp-clang + ldproxy——冷跑 20 分钟量级，不与每次 dev 推送抢跑账：手动触发或
  # 合入 main 的 PR 才跑（发布门前置）。两门各自 SKIP 纪律不变：前置缺位 = SKIP 明说，
  # 在位但编译失败/产物不在树 = 红。
  esp32-gates:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: 安装 esp 工具链（espup 钉版，esp32 + esp32s3 双档）
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL https://github.com/esp-rs/espup/releases/download/v0.17.1/espup-x86_64-unknown-linux-gnu \
            -o "$HOME/.local/bin/espup"
          chmod +x "$HOME/.local/bin/espup"
          "$HOME/.local/bin/espup" install --targets esp32,esp32s3
      - name: 安装 ldproxy
        run: cargo install ldproxy --locked
      - name: 克隆 ESP-IDF v5.2.2（版本钉与 tools/espidf-std-hello/README.md 登记表同源）
        run: |
          mkdir -p "$HOME/.espressif/frameworks"
          git clone --depth 1 -b v5.2.2 --recursive \
            https://github.com/espressif/esp-idf.git \
            "$HOME/.espressif/frameworks/esp-idf-v5.2.2"
          "$HOME/.espressif/frameworks/esp-idf-v5.2.2/install.sh" esp32 esp32s3
      - name: classic ESP32 外设基座门（debug + release）
        run: |
          # espup 生成的环境导出（LIBCLANG_PATH 等）供 +esp 工具链取用
          # shellcheck disable=SC1091
          . "$HOME/export-esp.sh"
          bash tools/ci/esp32-periph-base-check.sh
      - name: ESP32-S3 外设基座门（debug + release + 单测编译面）
        run: |
          # shellcheck disable=SC1091
          . "$HOME/export-esp.sh"
          bash tools/ci/esp32s3-periph-base-check.sh

  # 发行版快路轨冒烟（0.0.2 T5 / D8，ADR-0013 裁定 5 首证）：单步容器
  # （rust:bookworm，glibc 自洽，本机产物装本机 deb）内构建 → rr3-pack 出 deb →
  # dpkg -i → rrd 装配单正门起 5 模块 + rr3-brain 缺格点名。macOS 本机无法真装
  # deb（方案 P1），真装只认这个 job 的远端回执。
  distro-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 与其余 job 同源：runner 预装 rustc 版本不受控，① 现在编 brain（ureq/rustls
      # /ring MSRV 面），工具链必须钉 stable 而非吃镜像预装版
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: base/runtime
      - name: deb 装机冒烟（rust:bookworm 容器）
        run: bash tools/ci/distro-smoke.sh

  # 保底轨装配冒烟（0.0.2 修复批）：post-build.sh 装机布局 / entry 绝对化 /
  # config 随装 / 坏模块警告不阻断。纯 bash + 系统工具，夹具侧模拟 Buildroot
  # 目标根（TARGET_DIR），不需要 Docker 或 Buildroot 全量构建。
  buildroot-assembly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 保底轨装配冒烟（post-build.sh）
        run: bash tools/ci/buildroot-assembly-smoke.sh

  # 树莓派 / 瑞芯微部署面：aarch64-musl 静态产物构建门（与 pack-arm64 ① 同源，
  # rust-lld 零外部工具链；不需要真板/打包器）。brain 的 ureq+ring 需 aarch64 C
  # 工具链，归板上原生构建，不在本门（同 pack-arm64 ③ 分工）。
  arm64-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: base/runtime
      - name: aarch64-musl 静态产物七件
        run: bash tools/ci/arm64-cross-check.sh

  # D9 装配演练（0.0.2 T6）：装配单驱动 boot + 六 Rust 模块真进程（批N32 件四起
  # brain 也是 Rust），判据六模块全 running + denied_publish = 0。
  sim-assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: 装配演练（构建 + rr3-sim --profile）
        run: bash tools/ci/sim-assemble.sh

  # 批F4 全链闭环演练（§5.2 判据 10 sim 档）：采集→意图→判向→转向→表情六真
  # 进程 mock 闭环 + 总线观察者取证。
  sim-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: 全链闭环演练（构建 + rr3-sim --chain）
        run: bash tools/ci/sim-chain.sh

  # 点验矩阵出数入口（0.0.5 批M MC-10 L-1）：`tools/ci/matrix.sh` 此前**无任何调用方**
  # （不在 check.sh、不在 ci.yml）——本 job 让它真跑并出一行矩阵（architecture §12.6
  # 七列 / H3），产出**人工搬进** docs/status.md 矩阵行。出数 ≠ 判据：判据真源仍是
  # tools/ci/*.sh 与 check.sh 十步，矩阵只如实记"本环境实跑了什么、跑出什么"。
  # 非 --strict：⑦ 时序达标无固定载体（E4 真板专属，云 runner 是共享 x86、时间非硬件
  # 时间），默认口径如实记"未跑"不冒领 PASS、退 0；矩阵出现 FAIL 列时退 1（job 红）。
  matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: base/runtime
      # ① 的 ipct003.sh 第③路 arm64 容器真跑（docker run --platform linux/arm64）
      # 需要 binfmt——runner 缺省没有，缺它容器真跑失败（非 SKIP），① 被误判
      # "对拍破裂"致 job 红。ipct003 job 有同一步，此处与之同源。
      - uses: docker/setup-qemu-action@v3
      - name: 点验矩阵出数（bash tools/ci/matrix.sh）
        run: bash tools/ci/matrix.sh
