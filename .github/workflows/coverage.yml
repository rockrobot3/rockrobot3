# 覆盖率周程报表（非阻断）：先积累数据，再决定是否 ratchet 成门。
# 不进 PR 门禁——周程 + 手动触发，红不影响合入，只作为质量趋势的观测面。
name: coverage
on:
  schedule:
    # UTC 周日 19:15 = 北京周一 03:15，错开 gate（18:30）与 platforms（18:00）。
    - cron: "15 19 * * 0"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"

jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.100.0"
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: base/runtime
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: workspace 行覆盖率（summary-only）
        run: |
          set -o pipefail
          if ! cargo llvm-cov --locked --workspace \
               --manifest-path base/runtime/Cargo.toml \
               --summary-only 2>&1 | tee /tmp/coverage.txt; then
            echo "::warning title=coverage::覆盖率报表失败（周程非阻断，先看日志）"
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-summary
          path: /tmp/coverage.txt
          if-no-files-found: warn
