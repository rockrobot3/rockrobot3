# 发布流水线：把编译好的运行面推到 ghcr.io。
#
# 发布物 = 运行镜像（rrd + 六模块 + rr3-ctl + 契约/装配单/硬件描述），镜像根来自
# tools/deploy/stage-image.sh 的 rr3-pack stage 树——与 deb 装机布局同一份真值，
# 不另写一套文件摆放。amd64 / arm64 各在**原生 runner** 上构建（Intel/AMD 与
# 瑞芯微都是该架构的原生面），不引入交叉工具链，避免"编得过、跑不了"。
# riscv64（进迭时空）无原生 runner：走 ubuntu + apt 交叉 gcc + QEMU 构建，
# 路径先由 platforms 的 riscv-image 腿在每次 push 验证，发布腿只加 login/push/merge。
#
# 触发：打 v* 标签（发版）、main 分支（edge）、手动（自定义 tag）。
# PR 不触发：发布面不能被未合入的代码覆盖。
name: publish
on:
  push:
    tags: ["v*"]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "镜像标签（如 0.0.8 或 edge）"
        required: true
        default: edge

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.100.0"
      - uses: Swatinem/rust-cache@v2
        with:
          # 十件产物跨九个清单（runtime + 六模块 + rrctl + ota-ctl + rr3-pack）
          # 共写 /tmp/rr3-build：全量缓存共享依赖，单靠 workspace 缓存会冷编模块面。
          workspaces: base/runtime
          cache-all-crates: "true"

      - name: 计算发布标签（版本唯一真源 = 仓根 VERSION；tag 须指向 release 提交）
        id: meta
        # 版本纪律的执法点：VERSION 只能在 release(vX.Y.Z) 提交内变更，tag 与之同名；
        # 判据单点在 release-tag.sh（自检在 gate scripts job），不同源或非 release 提交即红。
        run: >-
          bash tools/ci/lib/release-tag.sh "${{ github.event_name }}" "${{ github.ref }}"
          "${{ github.ref_name }}" "${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
      - name: 原生构建运行面（rrd / 六模块 / rr3-ctl / rr3-ota-ctl / rr3-pack）
        env:
          CARGO_TARGET_DIR: /tmp/rr3-build
        run: |
          cargo build -q --locked --release --manifest-path base/runtime/Cargo.toml -p rrd
          for m in act brain connect interact sense power; do
            cargo build -q --locked --release --manifest-path "modules/rr3-$m/Cargo.toml"
          done
          cargo build -q --locked --release --manifest-path tools/rrctl/Cargo.toml
          cargo build -q --locked --release --manifest-path base/ota/rr3-ota-ctl/Cargo.toml
          cargo build -q --locked --release --manifest-path tools/rr3-pack/Cargo.toml

      - name: 铺镜像根（rr3-pack stage 树）
        env:
          CARGO_TARGET_DIR: /tmp/rr3-build
        run: |
          bash tools/deploy/stage-image.sh /tmp/rr3-image \
            "${{ matrix.arch }}" "${{ steps.meta.outputs.version }}"
          test -x /tmp/rr3-image/usr/bin/rrd

      - name: 登录 ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 发布件带 provenance + SBOM（2026-11-24 立）：buildx 只有在 --push 时才把
      # 证明面作为 attestation manifest 附进单架构清单；docker build 直推没有。
      # 证明面在 tag 窗口验证（runbook B 的 imagetools 检查），日常三线只验语法。
      - uses: docker/setup-buildx-action@v4
      - name: 构建并推送单架构镜像（含 provenance/SBOM）
        run: |
          tag="${{ steps.meta.outputs.tag }}"
          docker buildx build --platform "${{ matrix.platform }}" \
            --provenance=mode=max --sbom=true \
            --label "org.opencontainers.image.title=rockrobot3" \
            --label "org.opencontainers.image.version=${{ steps.meta.outputs.version }}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            -f tools/deploy/Containerfile \
            -t "${IMAGE}:${tag}-${{ matrix.arch }}" \
            --push /tmp/rr3-image

      # 推完即验：镜像能起来、装机树在、二进制能执行。判据住在
      # tools/deploy/image-smoke.sh（与本地同一份，改判据不必靠打标签等 CI），
      # 两段各自独立退出：容器起不来 / 装机树缺件 / 二进制不可执行归因不混。
      - name: 镜像冒烟（同架构真跑：可执行面 + 装机树 + rrd 用法输出）
        run: |
          tag="${{ steps.meta.outputs.tag }}"
          bash tools/deploy/image-smoke.sh file "${IMAGE}:${tag}-${{ matrix.arch }}"

      # 运行冒烟（比 --help 强一档）：镜像内按装机面真起 rrd，六模块全 spawn、零拒绝。
      # 判据与 distro-smoke ⑧ 同源，差别只在载体是发布镜像；容器无硬件面 →
      # 显式 sim 探测档 + mock 云，装配单整树复制做影子根（不搬单文件）。
      - name: 镜像运行冒烟（sim 探测档：六模块真起 + 零拒绝）
        run: |
          tag="${{ steps.meta.outputs.tag }}"
          bash tools/deploy/image-smoke.sh run "${IMAGE}:${tag}-${{ matrix.arch }}"

  # riscv64 腿（进迭时空）：与 amd64/arm64 产物同源同布局，差异只有工具链——
  # 交叉 gcc + QEMU。构建、stage 与两段冒烟全走 tools/deploy/build-riscv-image.sh，
  # 该脚本已由 platforms 的 riscv-image 腿在每次 push 验证，发布面只多推送一步。
  build-riscv64:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.100.0"
          targets: riscv64gc-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: base/runtime
          cache-all-crates: "true"
      - name: 安装 riscv64 交叉工具链
        uses: ./.github/actions/apt-retry
        with:
          packages: gcc-riscv64-linux-gnu
          title: apt-riscv-publish
          log: apt-riscv-pub

      - name: riscv64 工具链在位
        run: command -v riscv64-linux-gnu-gcc && command -v riscv64-linux-gnu-ar
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: riscv64
      - uses: docker/setup-buildx-action@v4
      - name: 计算发布标签（版本唯一真源 = 仓根 VERSION；tag 须指向 release 提交）
        id: meta
        run: >-
          bash tools/ci/lib/release-tag.sh "${{ github.event_name }}" "${{ github.ref }}"
          "${{ github.ref_name }}" "${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
      - name: 登录 ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 构建 riscv64 镜像（含两段冒烟）并推送（带 provenance/SBOM）
        env:
          RR3_VER: ${{ steps.meta.outputs.version }}
        run: |
          set -o pipefail
          ref="${IMAGE}:${{ steps.meta.outputs.tag }}-riscv64"
          if ! bash tools/deploy/build-riscv-image.sh --push "$ref" 2>&1 | tee /tmp/riscv-publish.log; then
            errs=$(grep -iE "error(\[|:)|failed|FAIL|undefined reference|manifest unknown" /tmp/riscv-publish.log | tail -5 | tr '\n' ' ')
            echo "::error title=riscv-publish::${errs:0:900}"
            exit 1
          fi
          docker manifest inspect "$ref" >/dev/null
          echo "PASS  已推送 $ref"

  merge:
    needs: [build, build-riscv64]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      # keyless 签名：GitHub OIDC token 换取 Fulcio 短期证书（runbook B.1）。
      id-token: write
    steps:
      # 合并腿要跑仓内 image-smoke.sh：没有 checkout 时 `bash tools/deploy/...`
      # 直接 exit 127（2026-11-18 main 首跑实证；此前 publish 只在 tag 触发，
      # 合并腿从未在 main 面被执行过）。
      - uses: actions/checkout@v7
      - name: 计算发布标签（版本唯一真源 = 仓根 VERSION；tag 须指向 release 提交）
        id: meta
        run: >-
          bash tools/ci/lib/release-tag.sh "${{ github.event_name }}" "${{ github.ref }}"
          "${{ github.ref_name }}" "${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
      - name: 登录 ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - name: 合并多架构清单
        id: merge
        run: |
          tag="${{ steps.meta.outputs.tag }}"
          docker buildx imagetools create -t "${IMAGE}:${tag}" \
            "${IMAGE}:${tag}-amd64" "${IMAGE}:${tag}-arm64" "${IMAGE}:${tag}-riscv64"
          # latest 只指向正式 semver tag（vX.Y.Z）且必须与 VERSION 同源：
          # edge/rc/手输数字标签一律不更新，避免把开发面或预发布当稳定版。
          if [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] && [ "${tag#v}" = "${{ steps.meta.outputs.version }}" ]; then
            docker buildx imagetools create -t "${IMAGE}:latest" \
              "${IMAGE}:${tag}-amd64" "${IMAGE}:${tag}-arm64" "${IMAGE}:${tag}-riscv64"
          fi
          docker buildx imagetools inspect "${IMAGE}:${tag}"
          # 合并结果必须真含三架构：单腿都绿但合并丢一条，是"看起来绿"的经典形态
          # （inspect 只打印不判等，所以这里把平台集合当判据）。python3 是 runner 自带面。
          # 判据体在 tools/ci/platform/manifest-platforms.py（纯函数 + 自检，
          # 2026-11-27 批132 从内联 heredoc 抽出）：判据只数**镜像清单**，
          # buildx 的 attestation manifest（platform=unknown/unknown）不计入架构集。
          docker buildx imagetools inspect --raw "${IMAGE}:${tag}" >/tmp/manifest.json
          python3 tools/ci/platform/manifest-platforms.py /tmp/manifest.json
          # 合并标签本身必须可拉取且装机树完整：两只单架构腿绿不等于合并清单
          # 指向的层都在（清单指向丢失层是"看起来发布成功"的经典形态）。
          bash tools/deploy/image-smoke.sh file "${IMAGE}:${tag}"
          digest=$(docker buildx imagetools inspect "${IMAGE}:${tag}" --format '{{json .Manifest}}' \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["digest"])')
          [ -n "$digest" ] || { echo "::error title=merge-digest::合并 digest 为空"; exit 1; }
          printf 'tag=%s\ndigest=%s\n' "$tag" "$digest" >> "$GITHUB_OUTPUT"
          echo "PASS  合并 digest ${digest}"
      - uses: sigstore/cosign-installer@v3
        with:
          cosign-release: "v2.6.5"
      - name: keyless 签名合并 digest（正/负身份验证）
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          ref="${IMAGE}@${{ steps.merge.outputs.digest }}"
          id_re='^https://github\.com/rockrobot3/rockrobot3/\.github/workflows/publish\.yml@refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$'
          issuer='https://token.actions.githubusercontent.com'
          cosign sign --yes "$ref"
          cosign verify "$ref" --certificate-identity-regexp "$id_re" \
            --certificate-oidc-issuer "$issuer" >/dev/null
          if cosign verify "$ref" --certificate-identity-regexp '^https://example\.invalid/$' \
               --certificate-oidc-issuer "$issuer" >/dev/null 2>&1; then
            echo "::error title=cosign-neg::错误 identity 未被拒绝"
            exit 1
          fi
          echo "PASS  cosign keyless 签名 + 正/负验证（$ref）"

  # 板侧固件制品（2026-11-16 立；2026-11-20 扩双芯片 + ghcr；2026-11-22 补同版
  # bootloader、分区表真值与烧录说明）：
  # classic 出 `safe` 档（默认 feature：外设底座 + 麦克风采集，不含云/播放），
  # S3 出 `full` 档（esp32s3,autonomy,tts：全链）。两档同带 -dev：构建期
  # RR3_ALLOW_DEV_ADMIN_TOKEN=1，开发令牌不冒充生产凭据。
  # 三载体同源：release asset（无凭据下载）、ghcr OCI（正式制品统一托管面，
  # 与运行镜像/OTA/buildroot 同址）、仓内 tools/deploy/flash-artifact.sh
  # （只校验 + 烧录，不构建）。
  #
  # 资产不止 app ELF：ESP-IDF ELF **不内嵌** bootloader 与分区表。espflash 未显式
  # 给 --bootloader 时用其自带镜像（IDF 版本与 app 不保证一致），故这里从同一
  # IDF 5.2.2 构建树取 bootloader.bin 一并发布；分区表以 partitions.csv 为真值，
  # 烧录时由 espflash 现场生成。烧录命令见随包的 FLASHING.md。
  firmware:
    # 发布 artifact 只认 tag 推送（2026-11-27 批144）：workflow_dispatch 在 tag ref 上
    # 也能被手动触发，而 release-tag.sh 对 dispatch 按"手输标签原样给"不判版本——
    # 若此处只判 refs/tags/v，dispatch 可绕过版本门推 firmware。firmware 是发布集，
    # 手动窗口的用途是 edge 镜像，不需要也不允许从这里出。
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      packages: write
      # keyless 签名固件 OCI（runbook B.1）。
      id-token: write
    steps:
      - uses: actions/checkout@v7
      # 版本门（2026-11-27 批142 补齐）：本 job 与 build 腿并行且只判 refs/tags/v，
      # 若不在这里调版本门，一个与 VERSION 不同源/未指向 release 提交的 v* 标签
      # 会让 build 腿红、firmware 腿照推——发布面版本纪律被绕开。同一单点
      # release-tag.sh，四个出制品出口（build/build-riscv/merge/firmware）全覆盖。
      - name: 版本门（tag 与 VERSION 同源且指向 release 提交）
        run: bash tools/ci/lib/release-tag.sh "${{ github.event_name }}" "${{ github.ref }}"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.100.0"
      - uses: ./.github/actions/esp-toolchain
        with:
          targets: esp32,esp32s3
      - name: 构建 classic safe / S3 full release 固件
        env:
          RR3_ALLOW_DEV_ADMIN_TOKEN: "1"
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          export IDF_PATH="$HOME/.espressif/frameworks/esp-idf-v5.2.2"
          export IDF_GITHUB_ASSETS=dl.espressif.com/github_assets
          export PIP_INDEX_URL="${PIP_INDEX_URL:-https://mirrors.cloud.tencent.com/pypi/simple}"
          export PIP_DEFAULT_TIMEOUT=60
          . "$GITHUB_WORKSPACE/tools/ci/lib/cargo-artifact.sh"
          cd "$GITHUB_WORKSPACE/tools/esp32-periph-base"
          fw_args=(
            --release
            --config 'source.crates-io.replace-with="rsproxy-sparse"'
            --config 'source.rsproxy-sparse.registry="sparse+https://rsproxy.cn/index/"'
          )
          if ! cargo +esp build "${fw_args[@]}" > /tmp/fw-classic.log 2>&1; then
            errs=$(grep -E "error(\[|:)|panicked at" /tmp/fw-classic.log | head -5 | tr '\n' ' ')
            echo "::error title=fw-build::classic safe release 构建失败：${errs:0:800}"
            exit 1
          fi
          if ! MCU=esp32s3 cargo +esp build "${fw_args[@]}" \
               --target xtensa-esp32s3-espidf \
               --no-default-features --features esp32s3,autonomy,tts \
               > /tmp/fw-s3.log 2>&1; then
            errs=$(grep -E "error(\[|:)|panicked at" /tmp/fw-s3.log | head -5 | tr '\n' ' ')
            echo "::error title=fw-build-s3::S3 full release 构建失败：${errs:0:800}"
            exit 1
          fi
          classic="$(rr3_cargo_artifact xtensa-esp32-espidf release esp32-periph-base)"
          s3="$(rr3_cargo_artifact xtensa-esp32s3-espidf release esp32-periph-base)"
          for f in "$classic" "$s3"; do
            [ -f "$f" ] || { echo "::error title=fw-elf::release ELF 不在树: $f"; exit 1; }
          done
          # bootloader 必须与 app 同一 IDF 构建（定位规则见 cargo-artifact.sh
          # 的 rr3_idf_bootloader；两处都没有即红，不退回 espflash 自带镜像）。
          boot_classic="$(rr3_idf_bootloader "$classic")" || {
            echo "::error title=fw-boot::classic bootloader.bin 不在产出树"; exit 1; }
          boot_s3="$(rr3_idf_bootloader "$s3")" || {
            echo "::error title=fw-boot-s3::S3 bootloader.bin 不在产出树"; exit 1; }
          cd "$GITHUB_WORKSPACE"
          # 发布集装配与三道判据（ELF 齐 / 分区表含 spool / bootloader magic e9）
          # 在 tools/deploy/fw-set.sh（2026-11-27 批135 从本步收出，名称与 sha
          # 清单是发布合同的一部分）。
          bash tools/deploy/fw-set.sh --from "$classic" "$s3" "$boot_classic" "$boot_s3"
      - name: 安装 espflash 4.6.0（整片镜像装配，预编译件 + sha256）
        run: |
          set -euo pipefail
          d=/tmp/espflash
          mkdir -p "$d"
          curl -fsSL --retry 3 --retry-delay 3 -o "$d/espflash.zip" \
            https://github.com/esp-rs/espflash/releases/download/v4.6.0/espflash-x86_64-unknown-linux-gnu.zip
          echo "c4fcfa32ddc3155608f003a230e6f3c184eff9641ec9cfa8eb54f1b515d403e7  $d/espflash.zip" \
            | sha256sum -c -
          unzip -o -q "$d/espflash.zip" -d "$d"
          install -m 0755 "$d/espflash" /usr/local/bin/espflash
          espflash --version
      # 整片烧录镜像 = basic 功能交付态：产线与无工具链机器只需 write_flash 0x0。
      # 装配逻辑与逐推验证面同源（tools/deploy/image-esp32.sh）。
      - name: 装配整片烧录镜像（classic safe / S3 full）
        run: |
          set -euo pipefail
          bash tools/deploy/image-esp32.sh --elf rr3-periph-base-esp32-safe-dev.elf \
            --chip esp32 --flash-size 4mb --out rr3-esp32-safe-merged.bin \
            --bootloader rr3-bootloader-esp32-dev.bin --partitions rr3-partitions.csv
          bash tools/deploy/image-esp32.sh --elf rr3-periph-base-esp32s3-full-dev.elf \
            --chip esp32s3 --flash-size 16mb --out rr3-esp32s3-full-merged.bin \
            --bootloader rr3-bootloader-esp32s3-dev.bin --partitions rr3-partitions.csv
          sha256sum rr3-esp32-safe-merged.bin rr3-esp32s3-full-merged.bin \
            | tee -a firmware-sha256.txt
      - name: 上传 release 资产（双芯片 + 同版 bootloader + 分区表 + 烧录说明）
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            rr3-periph-base-esp32-safe-dev.elf
            rr3-periph-base-esp32s3-full-dev.elf
            rr3-esp32-safe-merged.bin
            rr3-esp32s3-full-merged.bin
            rr3-bootloader-esp32-dev.bin
            rr3-bootloader-esp32s3-dev.bin
            rr3-partitions.csv
            FLASHING.md
            firmware-sha256.txt
          fail_on_unmatched_files: true
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: oras-project/setup-oras@v2
      - name: 不可变标签检查 + 推送固件到 ghcr
        run: |
          set -euo pipefail
          ref="ghcr.io/${{ github.repository_owner }}/rockrobot3-firmware:${{ github.ref_name }}"
          if out=$(oras manifest fetch "$ref" 2>&1); then
            echo "::error title=fw-immutable::已存在：$ref（拒绝覆盖）"
            exit 1
          fi
          if ! printf '%s' "$out" | grep -qiE 'not found|404|manifest unknown'; then
            echo "::error title=fw-immutable::读 $ref 失败且非 404：${out:0:400}"
            exit 1
          fi
          oras push "$ref" \
            --artifact-type application/vnd.rr3.firmware.v1+json \
            rr3-periph-base-esp32-safe-dev.elf:application/octet-stream \
            rr3-periph-base-esp32s3-full-dev.elf:application/octet-stream \
            rr3-esp32-safe-merged.bin:application/octet-stream \
            rr3-esp32s3-full-merged.bin:application/octet-stream \
            rr3-bootloader-esp32-dev.bin:application/octet-stream \
            rr3-bootloader-esp32s3-dev.bin:application/octet-stream \
            rr3-partitions.csv:text/csv \
            FLASHING.md:text/markdown \
            firmware-sha256.txt:text/plain
          oras manifest fetch "$ref" >/dev/null
          echo "PASS  已推送 $ref（双 ELF + 双整片镜像 + 双 bootloader + 分区表 + 烧录说明 + sha256）"
      - uses: sigstore/cosign-installer@v3
        with:
          cosign-release: "v2.6.5"
      - name: keyless 签名固件 OCI（正/负身份验证）
        run: |
          set -euo pipefail
          ref="ghcr.io/${GITHUB_REPOSITORY_OWNER}/rockrobot3-firmware:${GITHUB_REF_NAME}"
          digest=$(oras manifest fetch --descriptor "$ref" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["digest"])')
          [ -n "$digest" ] || { echo "::error title=fw-digest::固件 OCI digest 为空"; exit 1; }
          signed="ghcr.io/${GITHUB_REPOSITORY_OWNER}/rockrobot3-firmware@${digest}"
          id_re='^https://github\.com/rockrobot3/rockrobot3/\.github/workflows/publish\.yml@refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$'
          issuer='https://token.actions.githubusercontent.com'
          cosign sign --yes "$signed"
          cosign verify "$signed" --certificate-identity-regexp "$id_re" \
            --certificate-oidc-issuer "$issuer" >/dev/null
          if cosign verify "$signed" --certificate-identity-regexp '^https://example\.invalid/$' \
               --certificate-oidc-issuer "$issuer" >/dev/null 2>&1; then
            echo "::error title=cosign-neg-fw::错误 identity 未被拒绝"
            exit 1
          fi
          echo "PASS  cosign keyless 签名 + 正/负验证（$signed）"

  # 瑞芯微 RK3566 distro 快路轨的交付件（2026-11-27 批174）：版本化 bundle 此前只由
  # 板上/本机手工出包，发布面零交付——镜像覆盖 x86_64/arm64/riscv64，固件覆盖 esp32
  # 双芯片，唯独 RK3566 的 distro 包不在发布集。构建与断言步骤与 platforms 的
  # aarch64 腿同源（cross-artifacts → pack-bundle → bundle-contract），发布面只多
  # release 资产、ghcr OCI 与 keyless 签名三件事。
  # 只在 tag 推送出包：bundle 是发布集，手动窗口的用途是 edge 镜像（同 firmware 纪律）。
  distro-bundle:
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      packages: write
      # keyless 签名 distro OCI（与镜像/固件同一条 runbook B.1）。
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: 版本门 + 发布标签（tag 与 VERSION 同源且指向 release 提交）
        id: meta
        run: >-
          bash tools/ci/lib/release-tag.sh "${{ github.event_name }}" "${{ github.ref }}"
          "${{ github.ref_name }}" "${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.100.0"
          targets: aarch64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: base/runtime
          cache-all-crates: "true"
      - name: aarch64-musl 交叉构建（八件产物 + 全静态断言）
        run: |
          bash tools/ci/platform/cross-artifacts.sh aarch64-unknown-linux-musl 'ARM aarch64' static
      - name: 出包 + A10 契约断言（判据与 platforms 腿同源）
        run: |
          set -euo pipefail
          asset="rockrobot3-distro-${{ steps.meta.outputs.version }}-aarch64.tar.gz"
          bash tools/deploy/pack-bundle.sh aarch64-unknown-linux-musl "$asset"
          bash tools/ci/platform/bundle-contract.sh "$asset" \
            aarch64-unknown-linux-musl 'ARM aarch64'
          sha256sum "$asset" > distro-sha256.txt
          cat distro-sha256.txt
      - name: 上传 release 资产（distro bundle + sha256）
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            rockrobot3-distro-${{ steps.meta.outputs.version }}-aarch64.tar.gz
            distro-sha256.txt
          fail_on_unmatched_files: true
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: oras-project/setup-oras@v2
      - name: 不可变标签检查 + 推送 distro bundle 到 ghcr
        run: |
          set -euo pipefail
          ref="ghcr.io/${{ github.repository_owner }}/rockrobot3-distro:${{ github.ref_name }}"
          if out=$(oras manifest fetch "$ref" 2>&1); then
            echo "::error title=distro-immutable::已存在：$ref（拒绝覆盖）"
            exit 1
          fi
          if ! printf '%s' "$out" | grep -qiE 'not found|404|manifest unknown'; then
            echo "::error title=distro-immutable::读 $ref 失败且非 404：${out:0:400}"
            exit 1
          fi
          asset="rockrobot3-distro-${{ steps.meta.outputs.version }}-aarch64.tar.gz"
          oras push "$ref" \
            --artifact-type application/vnd.rr3.distro-bundle.v1.tar+gzip \
            "$asset:application/gzip" distro-sha256.txt:text/plain
          oras manifest fetch "$ref" >/dev/null
          echo "PASS  已推送 $ref（$asset + distro-sha256.txt）"
      - uses: sigstore/cosign-installer@v3
        with:
          cosign-release: "v2.6.5"
      - name: keyless 签名 distro OCI（正/负身份验证）
        run: |
          set -euo pipefail
          ref="ghcr.io/${GITHUB_REPOSITORY_OWNER}/rockrobot3-distro:${GITHUB_REF_NAME}"
          digest=$(oras manifest fetch --descriptor "$ref" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["digest"])')
          [ -n "$digest" ] || { echo "::error title=distro-digest::bundle OCI digest 为空"; exit 1; }
          signed="ghcr.io/${GITHUB_REPOSITORY_OWNER}/rockrobot3-distro@${digest}"
          id_re='^https://github\.com/rockrobot3/rockrobot3/\.github/workflows/publish\.yml@refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$'
          issuer='https://token.actions.githubusercontent.com'
          cosign sign --yes "$signed"
          cosign verify "$signed" --certificate-identity-regexp "$id_re" \
            --certificate-oidc-issuer "$issuer" >/dev/null
          if cosign verify "$signed" --certificate-identity-regexp '^https://example\.invalid/$' \
               --certificate-oidc-issuer "$issuer" >/dev/null 2>&1; then
            echo "::error title=cosign-neg-distro::错误 identity 未被拒绝"
            exit 1
          fi
          echo "PASS  cosign keyless 签名 + 正/负验证（$signed）"
