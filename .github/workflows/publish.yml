# 发布流水线：把编译好的运行面推到 ghcr.io。
#
# 发布物 = 运行镜像（rrd + 六模块 + rr3-ctl + 契约/装配单/硬件描述），镜像根来自
# tools/deploy/stage-image.sh 的 rr3-pack stage 树——与 deb 装机布局同一份真值，
# 不另写一套文件摆放。amd64 / arm64 各在**原生 runner** 上构建（Intel/AMD 与
# 瑞芯微都是该架构的原生面），不引入交叉工具链，避免"编得过、跑不了"。
#
# 触发：打 v* 标签（发版）、main 分支（edge）、手动（自定义 tag）。
# PR 不触发：发布面不能被未合入的代码覆盖。
name: publish
on:
  push:
    tags: ["v*"]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "镜像标签（如 0.0.8 或 edge）"
        required: true
        default: edge

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: base/runtime

      - name: 计算发布标签
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
          elif [ "${GITHUB_REF}" != "${GITHUB_REF#refs/tags/}" ]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag=edge
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: 原生构建运行面（rrd / 六模块 / rr3-ctl / rr3-pack）
        env:
          CARGO_TARGET_DIR: /tmp/rr3-build
        run: |
          cargo build -q --locked --release --manifest-path base/runtime/Cargo.toml -p rrd
          for m in act brain connect interact sense power; do
            cargo build -q --locked --release --manifest-path "modules/rr3-$m/Cargo.toml"
          done
          cargo build -q --locked --release --manifest-path tools/rrctl/Cargo.toml
          cargo build -q --locked --release --manifest-path tools/rr3-pack/Cargo.toml

      - name: 铺镜像根（rr3-pack stage 树）
        env:
          CARGO_TARGET_DIR: /tmp/rr3-build
        run: |
          bash tools/deploy/stage-image.sh /tmp/rr3-image \
            "${{ matrix.arch }}" "${{ steps.meta.outputs.version }}"
          test -x /tmp/rr3-image/usr/bin/rrd

      - name: 登录 ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送单架构镜像
        run: |
          tag="${{ steps.meta.outputs.tag }}"
          docker build --platform "${{ matrix.platform }}" \
            -f tools/deploy/Containerfile \
            -t "${IMAGE}:${tag}-${{ matrix.arch }}" /tmp/rr3-image
          docker push "${IMAGE}:${tag}-${{ matrix.arch }}"

      # 推完即验：镜像能起来、装机树在、二进制能执行。判据放在**同架构原生
      # runner** 上（不跨架构模拟），gem 与发布件一致。`rrd --help` 的退出码是 1
      # （缺装配面属用法错），所以判输出而不是判退出码——只断言"它真跑起来了"。
      # 三条断言各自独立：容器起不来 / 装机树缺件 / 二进制不可执行，归因不混。
      - name: 镜像冒烟（同架构真跑：可执行面 + 装机树 + rrd 用法输出）
        run: |
          tag="${{ steps.meta.outputs.tag }}"
          img="${IMAGE}:${tag}-${{ matrix.arch }}"
          if ! docker run --rm --entrypoint sh "$img" -c '
                test -x /usr/bin/rrd || { echo "缺 /usr/bin/rrd"; exit 1; }
                test -f /usr/lib/rockrobot3/contracts/topics.toml || { echo "缺 contracts/topics.toml"; exit 1; }
                test -f /usr/lib/rockrobot3/profiles/distro.toml || { echo "缺 profiles/distro.toml"; exit 1; }
              '; then
            echo "::error title=image-smoke::装机树缺件（镜像内的运行面不完整）"
            exit 1
          fi
          out=$(docker run --rm "$img" --help 2>&1) || rc=$?
          echo "$out" | head -3
          if ! printf '%s' "$out" | grep -q "用法: rrd"; then
            # 失败必须自带现场：只写"不可运行"时根因（glibc 版本、权限、入口）不可见。
            # 2026-11-15 首版注解没带输出，arm64 腿红了一轮却只能靠推断——补现场。
            brief=$(printf '%s' "$out" | head -3 | tr '\n' ' ')
            echo "::error title=image-smoke::镜像内 rrd 未打印用法（rc=${rc:-0}）：${brief:0:600}"
            exit 1
          fi
          echo "PASS  镜像冒烟：$img 可执行且装机树完整"

      # 运行冒烟（比 --help 强一档）：镜像内按装机面真起 rrd，六模块全 spawn、零拒绝。
      # 判据与 tools/ci/distro-smoke.sh ⑧ 同源，差别只在载体是发布镜像而非 deb 装机；
      # 容器无硬件面 → 显式 sim 探测档 + mock 云。装配单**不能**搬到 /tmp 单文件：
      # modules-root = 装配单的祖父目录（profile/boot/load.rs 的定位判据），单文件复制会
      # 让模块发现面打空。故复制整棵装机树做影子根，只在副本上把 hal_backend 改 sim
      # （镜像内原件不动，与演练沙箱同一语义）。这一步回答"发布件能不能真跑起来"。
      - name: 镜像运行冒烟（sim 探测档：六模块真起 + 零拒绝）
        run: |
          tag="${{ steps.meta.outputs.tag }}"
          img="${IMAGE}:${tag}-${{ matrix.arch }}"
          set -o pipefail
          rc=0
          docker run --rm --entrypoint sh "$img" -c '
                set -e
                cp -a /usr/lib/rockrobot3 /tmp/rr3root
                sed -i "s/^hal_backend = \"linux\"/hal_backend = \"sim\"/" /tmp/rr3root/profiles/distro.toml
                grep -q "hal_backend = \"sim\"" /tmp/rr3root/profiles/distro.toml
                RR3_DATA_DIR=/tmp RR3_BRAIN_CLOUD=mock RR3_PROBE=sim \
                  /usr/bin/rrd --socket /tmp/s.rrd \
                    --contracts /tmp/rr3root/contracts \
                    --profile /tmp/rr3root/profiles/distro.toml >/tmp/rrd.log 2>&1 &
                pid=$!
                ok=""
                for _ in $(seq 1 45); do
                  n=0
                  for m in act brain connect interact sense power; do
                    grep -q "spawn rr3-$m pid=" /tmp/rrd.log && n=$((n+1))
                  done
                  [ "$n" -eq 6 ] && ok=1 && break
                  sleep 1
                done
                if [ -z "$ok" ]; then
                  echo "FAIL 六模块未起齐"
                  tail -30 /tmp/rrd.log
                  kill $pid 2>/dev/null || true
                  exit 1
                fi
                if grep -q "拒绝 boot" /tmp/rrd.log; then
                  echo "FAIL 出现拒绝 boot"
                  grep -n "拒绝 boot" /tmp/rrd.log | head -5
                  tail -10 /tmp/rrd.log
                  kill $pid 2>/dev/null || true
                  exit 1
                fi
                kill $pid 2>/dev/null || true
                echo "PASS 六模块起齐且零拒绝"
              ' >/tmp/img-smoke.log 2>&1 || rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "--- 镜像运行冒烟日志尾部 ---"
            tail -30 /tmp/img-smoke.log
            brief=$(tail -12 /tmp/img-smoke.log | tr '\n' ' ')
            echo "::error title=image-run-smoke::未起齐（rc=$rc）：${brief:0:700}"
            exit 1
          fi
          tail -2 /tmp/img-smoke.log

  merge:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 登录 ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: 合并多架构清单
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
          elif [ "${GITHUB_REF}" != "${GITHUB_REF#refs/tags/}" ]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag=edge
          fi
          docker buildx imagetools create -t "${IMAGE}:${tag}" \
            "${IMAGE}:${tag}-amd64" "${IMAGE}:${tag}-arm64"
          # 发版标签同时更新 latest（edge 不更新，避免把开发面当稳定版）
          case "$tag" in
            v*|[0-9]*) docker buildx imagetools create -t "${IMAGE}:latest" \
                         "${IMAGE}:${tag}-amd64" "${IMAGE}:${tag}-arm64" ;;
          esac
          docker buildx imagetools inspect "${IMAGE}:${tag}"
          # 合并结果必须真含两架构：单腿都绿但合并丢一条，是"看起来绿"的经典形态
          # （inspect 只打印不判等，所以这里把平台集合当判据）。python3 是 runner 自带面。
          python3 - "${IMAGE}:${tag}" <<'PY'
          import json, subprocess, sys
          img = sys.argv[1]
          raw = subprocess.run(
              ["docker", "buildx", "imagetools", "inspect", "--raw", img],
              capture_output=True, text=True, check=True,
          ).stdout
          plats = sorted(
              m.get("platform", {}).get("architecture", "?")
              for m in json.loads(raw).get("manifests", [])
          )
          want = ["amd64", "arm64"]
          if plats != want:
              print(f"::error title=manifest-platforms::合并清单架构 {plats}（期望 {want}）")
              sys.exit(1)
          print("PASS  多架构清单架构:", plats)
          PY
