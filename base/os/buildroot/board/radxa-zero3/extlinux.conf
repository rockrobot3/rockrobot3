# extlinux.conf —— rockrobot3 正常启动项（Radxa ZERO 3 / RK3566）
#
# 放置于 boot 分区的 /extlinux/extlinux.conf，由 U-Boot 的 distro boot
# 机制自动发现（defconfig：BR2_TARGET_UBOOT_BOARD_DEFCONFIG=radxa-zero-3-rk3566）。
# boot 分区布局见同目录 genimage.cfg。

label rockrobot3
    kernel /Image
    fdt /rk3566-radxa-zero-3.dtb
    # root=LABEL=rr_a：默认从 A 槽起。A/B 持久切换由 rr3-ota-ctl 改写本行
    # 标签实现（判定逻辑在 rr-ota::bootconf，0.0.3 批D 主机面实装；只动本行
    # 标签，注释与其余字节不碰）。bootcount/altbootcmd 自动回滚链属板上件，
    # 语义与核对项见 base/ota/partition-layout.md 增补段。
    append root=LABEL=rr_a rootwait rw console=ttyS2,1500000

# 板上核对项（硬件未采购，以下三条未实测）：
#   1. 串口参数 console=ttyS2,1500000 是否命中 RK3566 调试 UART；
#   2. fdt 文件名与内核构建产物逐字一致；
#   3. rootwait 时序下 eMMC/SD 枚举是否稳定。
