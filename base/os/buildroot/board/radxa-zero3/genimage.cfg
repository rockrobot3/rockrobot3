image boot.vfat {
	vfat {
		files = {
			"Image",
			"rk3566-radxa-zero-3.dtb",
			"extlinux/extlinux.conf",
		}
	}

	# 引导分区：SPL/U-Boot 烧写在该分区之前的裸区（见下方 uboot 两个 partition），
	# 内核 Image + dtb + extlinux.conf 走 distro boot。
	# 容量是构建期参数：@BOOT_SIZE@ 由 board/radxa-zero3/post-image.sh 注入。
	size = @BOOT_SIZE@
	label = "boot"
}

image rr_a.ext4 {
	ext4 {
		label = "rr_a"
	}

	# A 槽 rootfs（当前运行槽）。与 rr_b 同源于 Buildroot 的 rootfs.ext4，
	# 出厂烧录时两槽内容一致，升级后才分叉。
	mountpoint = "/"
	size = @RR_A_SIZE@
}

image rr_b.ext4 {
	ext4 {
		label = "rr_b"
	}

	# B 槽 rootfs（对侧槽）。标签与 rr-ota 的 RR3_OTA_SLOT_NAMES 逐字一致
	#（守护用例：base/runtime/rr-ota/src/lib.rs 测试区）。
	mountpoint = "/"
	size = @RR_B_SIZE@
}

image rr_factory.ext4 {
	ext4 {
		label = "rr_factory"
	}

	# 出厂恢复镜像，只读（写入方仅产线烧录；断电安全约束见
	# base/ota/partition-layout.md：任何代码路径不得写入）。
	mountpoint = "/"
	size = @RR_FACTORY_SIZE@
}

image rr_staging.ext4 {
	ext4 {
		label = "rr_staging"
	}

	# 模块级更新暂存区（ADR-0007 决策二：独立可写分区，布局现在即预留）。
	# 标签与 rr-ota 的 RR3_OTA_STAGING_PARTITION 逐字一致。
	size = @RR_STAGING_SIZE@
}

image data.ext4 {
	ext4 {
		label = "rr_data"
	}

	# 用户数据与配置，升级不动。
	size = @RR_DATA_SIZE@
}

image rock3-zero3.img {
	hdimage {
		partition-table-type = "gpt"
	}

	# RK3566 引导链的裸区约定（板上核对项，与 U-Boot 的加载偏移联动）：
	# idbloader.img（TPL+SPL）写偏移 32KiB（0x2000 扇区号 64），
	# u-boot.itb 写偏移 6MiB；两者都落在 boot 分区之前。
	partition uboot-idbloader {
		image = "idbloader.img"
		offset = 32K
	}

	partition uboot-itb {
		image = "u-boot.itb"
		offset = 6M
	}

	partition boot {
		# "U" = EFI System Partition 的 GPT 类型别名（genimage 语法）
		partition-type-uuid = U
		bootable = "true"
		image = "boot.vfat"
		offset = 16M
	}

	partition rr_a {
		image = "rr_a.ext4"
	}

	partition rr_b {
		image = "rr_b.ext4"
	}

	partition rr_factory {
		image = "rr_factory.ext4"
	}

	partition rr_staging {
		image = "rr_staging.ext4"
	}

	partition data {
		image = "data.ext4"
	}
}
