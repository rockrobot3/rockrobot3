# RockRobot3 Pi 4B 单板：YD2076 双麦（左右通道交换），回放 USB C-Media。
# 由 deb 的 postinst 在 /etc/asound.conf 缺失时安装；已有配置不覆盖。
pcm.rr3 {
    type asym
    playback.pcm { type plug; slave.pcm "hw:CARD=Device,DEV=0" }
    capture.pcm {
        type plug
        slave {
            pcm {
                type route
                slave { pcm "hw:CARD=YD2076,DEV=0" channels 2 }
                ttable.0.1 1
                ttable.1.0 1
            }
        }
    }
}
