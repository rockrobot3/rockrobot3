[Service]
# Pi 4B 单板：YD2076 双麦采集 / USB C-Media 回放，经 /etc/asound.conf 的
# asym PCM "rr3" 分流；本文件由 deb 的 postinst 铺到
# /etc/systemd/system/rrd.service.d/pi4b-solo.conf（systemd 段归包管，每次覆盖）。
Environment=RR3_HAL_ALSA_DEVICE=rr3
Environment=RR3_SENSE_CONFIG=/usr/lib/rockrobot3/modules/rr3-sense/config-pi4b.toml
EnvironmentFile=-/etc/rockrobot3/cloud.env
Environment=RR3_SECRETS_FILE=/etc/rockrobot3/secrets.json
