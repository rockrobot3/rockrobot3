[package]
name = "rr3-ota-ctl"
version = "0.0.1"
edition = "2021"
rust-version = "1.82"
license = "UNLICENSED"
publish = false
description = "OTA 槽位查看/切换 CLI（0.0.3 批D：switch/factory 引导配置改写实装；回滚链属板上件）"

# 独立工程：base/ota 不在 base/runtime workspace 内
[workspace]

[[bin]]
name = "rr3-ota-ctl"
path = "src/main.rs"

[dependencies]
rr-ota = { path = "../../runtime/rr-ota" }
