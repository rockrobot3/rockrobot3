[package]
name = "rr-hal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "硬件抽象层（HAL）实现层：Linux/sim 后端实现 rr-hal-api 契约（契约层 no_std，ADR-0018 修订 1 ③）"

[lib]
name = "rr_hal"
path = "src/lib.rs"

# linux ALSA 后端的双门：feature `alsa`（经 dep:alsa 只激活目标平台内声明的可选依赖）
# + `target_os = "linux"`（与 src/linux.rs 的 #[cfg] 门一致）。cargo 不支持在 target cfg
# 表里写 feature = "..."（会警告且不生效），所以依赖挂 target 表 + optional，feature 只做开关。
# 非 linux 平台开 `alsa` feature 是 no-op（依赖不参与解析），真机验证属板上收口（docs/status.md）。
[features]
alsa = ["dep:alsa"]

[dependencies]
# 能力面契约（0.0.5 批I F1）：7 trait 同步签名 + 值类型 + 错型在本 crate re-export，
# 契约名与路径不变；本 crate 是它的 Linux/sim 实现层（ADR-0018 修订 1 ③）。
rr-hal-api = { path = "../rr-hal-api" }
# 物理绑定描述符解析（descriptor.rs，批D④/ADR-0018 裁定 4）：rrd 注入的
# [hardware] 序列化文本是 TOML 平表，与 rrd/rr-registry 共用 workspace 同版 toml。
toml = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
alsa = { version = "0.9", optional = true }
# chardev GPIO 的 ioctl/close 声明（linux_gpio.rs，R11②）：纯 Rust 壳，
# musl 静态链接零额外 C 库依赖（R13）；锁内已有 0.2.189（alsa 传递依赖）。
libc = "0.2"
