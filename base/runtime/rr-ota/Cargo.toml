[package]
name = "rr-ota"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "升级通道骨架：整镜像 A/B 槽与模块级 staging 类型（ADR-0007 决策二）"

[lib]
name = "rr_ota"
path = "src/lib.rs"

[dependencies]
# env 区 CRC32 与 A-IPC 载荷同一份实现（IEEE 802.3，U-Boot crc32(0, …) 同形态）——
# 单点真值，不在本 crate 抄第二份。
rr-ipc = { path = "../rr-ipc" }
# OTA 签名/验签（ADR-0026）：Ed25519 用纯 Rust 实现，避免目标 C 工具链与
# 外部 openssl 依赖；zeroize 让签名密钥离开作用域即擦除。sha2 同一棵树，
# 不另引 hash crate。
ed25519-dalek = { version = "2", default-features = false, features = ["std", "zeroize"] }
sha2 = "0.10"
