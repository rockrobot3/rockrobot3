# 模块 manifest（modules/<id>/module.toml）的字段契约
# 逐行来源：docs/process/dev/0.0.1版本洛克三号开发方案.md §4（D3 模块四件套之 manifest）
# 消费方：base/runtime/rr-registry（校验实现）、tools/mkmodule（bin rr3-mkmod，生成自检）、CI（D7②）
# 演进：只增不改；破坏性变更须升 schema_version 并同步 rr-registry 测试
# 引用：ADR-0002（能力仲裁）、ADR-0007 决策二（upgrades 字段先就位、实现后置）、
#       ADR-0009（依赖仲裁：可满足者 = 本表 ∪ 本次 boot 全集 provides）

schema_version = 1

# ---------- [manifest] ----------
[[field]]
path = "manifest.schema_version"
kind = "int"
required = true

[[field]]
path = "manifest.name"
kind = "string"
required = true
rule = "module_name"

[[field]]
path = "manifest.version"
kind = "string"
required = true
rule = "semver"

[[field]]
path = "manifest.type"
kind = "string"
required = true
rule = "type"

[[field]]
path = "manifest.lang"
kind = "string"
required = true
rule = "lang"

[[field]]
path = "manifest.entry"
kind = "string"
required = true

# ---------- [provides] / [depends] ----------
[[field]]
path = "provides.capabilities"
kind = "list"
required = false
rule = "capability"

[[field]]
path = "depends.required"
kind = "list"
required = false
rule = "capability"

[[field]]
path = "depends.optional"
kind = "list"
required = false
rule = "capability"

# ---------- [events] / [rpc] ----------
[[field]]
path = "events.publishes"
kind = "list"
required = true
rule = "own_topic"

[[field]]
path = "events.subscribes"
kind = "list"
required = true
rule = "topic"

[[field]]
path = "rpc.exposes"
kind = "list"
required = false
rule = "own_topic"

# ---------- [resources] ----------
[[field]]
path = "resources.restart_policy"
kind = "string"
required = true
rule = "restart_policy"

[[field]]
path = "resources.mem_limit_mb"
kind = "int"
required = false

[[field]]
path = "resources.start_priority"
kind = "int"
required = false

# ---------- [health]（跨字段规则 heartbeat < watchdog 在 validate.rs 内实现） ----------
[[field]]
path = "health.heartbeat_ms"
kind = "int"
required = true

[[field]]
path = "health.watchdog_timeout_ms"
kind = "int"
required = true

# ---------- [upgrades]（ADR-0007 预留，v0.0.1 允许缺省） ----------
[[field]]
path = "upgrades.min_from_semver"
kind = "string"
required = false
rule = "semver"

[[field]]
path = "upgrades.staging"
kind = "bool"
required = false

# ---------- 规则表（rr3_registry_check 消费） ----------
[rules]
type = ["module", "brain"]
lang = ["rust", "python"]
restart_policy = ["always", "on-failure", "never"]
topic_allowed_kinds = ["request", "event", "stream", "notification"]
# v0.0.1 的"依赖只许 base 白名单"已由 ADR-0009 定型：可满足者 = 本表 ∪ 本次 boot
# 全集内各 manifest 的 provides.capabilities；可满足性与环检测在 depends.rs 的
# 跨 manifest 仲裁（rrd boot 与 CI 全集检查共用），单件校验只保 capability 形状
base_capabilities = ["bus.publish", "bus.subscribe", "bus.rpc", "net.online", "power.battery", "power.rail", "power.budget"]
