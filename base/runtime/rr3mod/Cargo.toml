# base/runtime/rr3mod/Cargo.toml（书写风格与 rr-bus-api/Cargo.toml 同款；批N25 件一
# §1.2-1 依赖面订正：承载客户端真身在 rr-bus-api（基-35 窄化②），rr-hal 无读者裁撤）
[package]
name = "rr3mod"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "模块公共骨架：同构启动序列编排（bootstrap/serve/Dispatcher），只编排不重写"

[lib]
name = "rr3mod"
path = "src/lib.rs"

[dependencies]
rr-bus-api = { path = "../rr-bus-api" }
rr-ipc = { path = "../rr-ipc" }
rr-core = { path = "../rr-core" }
serde_json = { workspace = true }
# 依赖单向：rr3mod → rr-bus-api/rr-ipc/rr-core；反向零依赖由批0 验收的 cargo tree 断言把门
