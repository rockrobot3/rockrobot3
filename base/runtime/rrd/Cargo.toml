[package]
name = "rrd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "base 层守护进程（模块注册与健康）"

[lib]
name = "rrd"
path = "src/lib.rs"

[[bin]]
name = "rrd"
path = "src/main.rs"

# 测试夹具二进制（spec §6 / R5）：为什么在 rrd 包里而不是 spec §8 写的 base/runtime/tests/sim-peer/
# ——测试要 `env!("CARGO_BIN_EXE_sim_peer")` 的绝对路径（manifest 的 entry 门禁要绝对路径，
# 而构建产物路径随机器/平台/CARGO_TARGET_DIR 变），cargo 只为**同一个包**的 bin 设这个变量。
[[bin]]
name = "sim_peer"
path = "src/bin/sim_peer.rs"

[dependencies]
rr-ipc = { path = "../rr-ipc" }
rr-registry = { path = "../rr-registry" }
rr-bus = { path = "../rr-bus" }
# 执行件档案装载（批N3 件二）：档案十四键词表与值面 Rr3ActProfile 的真值源——
# rrd 是装载域，吃契约层，不反向（⑨-w 禁令只约束 modules 单元）
rr-hal-api = { path = "../rr-hal-api" }
# unix 门内的 socket 放行声明壳（chmod/getgrnam/chown，批F5b R12）——musl 静态零额外 C 依赖
libc = "0.2"
toml = { workspace = true }
serde_json = { workspace = true }
