# RockRobot3 能力格坐标系（[SC] 契约层，单一事实源）
# 消费方：base/runtime/rr-registry（查册门，CI 全集层与 rrd 装配链共用）、tools/mkmod（生成自检）、docs
# 约束：slot 名唯一；layer 只取 base | body | cognition；不留空格（进表即有真实供给方或需求方）
# 基础层 = base_capabilities（module.schema.toml [rules]）的表内化，格名随原能力名（两段式），
#   查册门把两者钉死等价——第二份白名单不存在
# 引用：ADR-0012 裁定 1/5、增补注记（base-supply/base-bus 分族）、ADR-0009 裁定 1、
#   ADR-0018 修订 1（承载三档）、architecture.md §4.3
#
# schema_version = 2（0.0.5 批J C17 裁定 (a)，破坏性契约变更）：每格新增两轴——
#   status        三态标记：normal | placeholder | retired（三态说这张格有没有件；
#                 占位格 sensor.env/sensor.imu 显式标记，占位 ≠ 通过——批K H1 门读它判分母）
#   tier_scope    该格适用的承载档（host | rtos | bare 的非空子集——适用性说这档要不要
#                 这张格；base-bus 四格 bare 不适用，ADR-0012 增补注记分族即其真值）。
#                 两轴分判不混判：把"这形态本就没有总线"误报成"缺件"即违此列语义
# 变更纪律：加格 = append（同步更新 contract.rs 的形状 pin）；status/tier_scope/层集
#   变更 = 破坏性 = 升 schema_version 并走契约级评审

schema_version = 2

# ---------- 基础层（基座内建，永远在位，不进 profile [bindings]） ----------
# 分族（ADR-0012 增补注记）：bus.* 与 net.online = base-bus（host / rtos(经桥) 档在位，
# bare 自足档不适用）；power.battery = 通道型 body 语义样例（真跨档，读数可缺）。
[[slot]]
name = "bus.publish"
layer = "base"
status = "normal"
tier_scope = ["host", "rtos"]
note = "总线发布（rr-bus 客户端承载，ADR-0003）"

[[slot]]
name = "bus.subscribe"
layer = "base"
status = "normal"
tier_scope = ["host", "rtos"]
note = "总线订阅"

[[slot]]
name = "bus.rpc"
layer = "base"
status = "normal"
tier_scope = ["host", "rtos"]
note = "rr3.call 同步调用（rrd 代理，trace_id 语义见 contracts/README.md）"

[[slot]]
name = "net.online"
layer = "base"
status = "normal"
tier_scope = ["host", "rtos"]
note = "出网就绪通告通道（通道 boot 即在位、恒不降级；在线/离线状态由 connect 运行期发布，反应归策略层——ADR-0012 裁定 1 base 格语义注记）"

[[slot]]
name = "power.battery"
layer = "base"
status = "normal"
tier_scope = ["host", "rtos", "bare"]
note = "电池读数通道（通道 boot 即在位、恒不降级；电量读数由 rr3-power 运行期发布，反应归策略层——ADR-0012 裁定 1 base 格语义注记）"

