# RockRobot3 主题所有权注册表（[SC] 契约层，单一事实源）
# 消费方：base/runtime/rr-registry（校验）、tools/mkmodule（脚手架自检）、docs 生成
# 约束：owner 唯一；topic 必须以 "<owner>/" 开头；kind 对应 A-IPC payload 类型
# 引用：ADR-0006 §2/§6、ADR-0007 决策一、naming.md

schema_version = 1

# ---------- 模块所有权（v0.0.1 的 5+1 模块 + base 运行时） ----------
[[owner]]
name = "rr3-sense"
path = "modules/rr3-sense"
role = "感知：麦克风阵列、环境传感器、IMU"

[[owner]]
name = "rr3-act"
path = "modules/rr3-act"
role = "执行：舵机/电机、反射环宿主进程"

[[owner]]
name = "rr3-interact"
path = "modules/rr3-interact"
role = "交互：表情屏、TTS 播放、拾音状态机"

[[owner]]
name = "rr3-power"
path = "modules/rr3-power"
role = "电源：电池、充电、低压关断兜底"

[[owner]]
name = "rr3-connect"
path = "modules/rr3-connect"
role = "连接：WiFi 链路、云端会话"

[[owner]]
name = "rr3-brain"
path = "modules/rr3-brain"
role = "认知：ASR/LLM/TTS 编排（Python）"

[[owner]]
name = "rr3-runtime"
path = "base/runtime/rrd"
role = "base 守护进程：注册、健康、系统广播"

[[owner]]
name = "rr3-sentinel"
path = "tools/espidf-sentinel"
role = "跨芯片哨兵：ESP32 固件经 rr3-bridge 进城（0.0.7 层③④；总线身份 rr3-sentinel，工程名 espidf-sentinel 不变）"

# ---------- 主题 ----------
[[topic]]
name = "rr3-sense/audio/pcm"
kind = "stream"
owner = "rr3-sense"
stable = "L1"
note = "原始 PCM 上行。ADR-0007 归实时控制面；M5 前不实现 shm 传输"

[[topic]]
name = "rr3-sense/audio/vad_start"
kind = "event"
owner = "rr3-sense"
stable = "L2"
note = "静音/起音边沿，携带置信度摘要而非闭环数据"

[[topic]]
name = "rr3-sense/env/temperature"
kind = "event"
owner = "rr3-sense"
stable = "L2"

[[topic]]
name = "rr3-sense/imu/state"
kind = "stream"
owner = "rr3-sense"
stable = "L2"
note = "IMU 姿态摘要（融合在 act 反射环内完成，此处仅摘要上报）"

[[topic]]
name = "rr3-act/servo/command"
kind = "request"
owner = "rr3-act"
stable = "L1"
note = "角度/时限指令，JSON-RPC 事务面（<100Hz）"

[[topic]]
name = "rr3-act/servo/state"
kind = "stream"
owner = "rr3-act"
stable = "L2"

[[topic]]
name = "rr3-act/motor/reflex"
kind = "notification"
owner = "rr3-act"
stable = "L1"
note = "仅反射环异常/饱和通告。闭环本身永不进总线（ADR-0007 裁定 1）"

[[topic]]
name = "rr3-act/led/effect"
kind = "request"
owner = "rr3-act"
stable = "L2"

[[topic]]
name = "rr3-interact/face/expression"
kind = "request"
owner = "rr3-interact"
stable = "L1"
note = "表情切换（idle/blink/talk/think/happy；批F3 增 listen/turn；2026-10-15 板上批增 char 单字符档 36 态 charA..charZ/char0..char9；talk 由 TTS 播放自动驱动）"

[[topic]]
name = "rr3-interact/tts/text"
kind = "request"
owner = "rr3-interact"
stable = "L1"

[[topic]]
name = "rr3-interact/asr/text"
kind = "event"
owner = "rr3-interact"
stable = "L1"
status = "retired"
note = "0.0.5 批J C14 首例退役（ADR-0019 修订 2 ②，2026-10-10 评审裁定）：号位保留、义务解除——全仓唯一发布点是 sim 演练，随批换至 rr3-sense/audio/vad_start；申报面引用本主题即被 rr-registry 门拒"

[[topic]]
name = "rr3-interact/dialog/turn"
kind = "event"
owner = "rr3-interact"
stable = "L2"
status = "retired"
note = "0.0.5 批J C14 同批退役（ADR-0019 修订 2 ②，2026-10-10 评审裁定）：号位保留、义务解除——全仓零生产点（连演练都不产）；申报面引用本主题即被 rr-registry 门拒"

[[topic]]
name = "rr3-power/battery/state"
kind = "event"
owner = "rr3-power"
stable = "L1"
note = "电压/电量/温度摘要；低压关断为 power 模块本地决策，不依赖总线"

[[topic]]
name = "rr3-power/charger/state"
kind = "event"
owner = "rr3-power"
stable = "L2"

[[topic]]
name = "rr3-connect/net/link"
kind = "event"
owner = "rr3-connect"
stable = "L1"
note = "链路摘要事件（翻转必发 + 周期保底；up=链路层已关联不表可出网——增补轮六 D5 裁定，出网性由 net.online 通道另证；AP 态恒 up=false）。负载 schema 见 events/connect-net-link.schema.json"

[[topic]]
name = "rr3-connect/cloud/session"
kind = "request"
owner = "rr3-connect"
stable = "L2"

[[topic]]
name = "rr3-brain/llm/completion"
kind = "request"
owner = "rr3-brain"
stable = "L1"

[[topic]]
name = "rr3-brain/intent/result"
kind = "event"
owner = "rr3-brain"
stable = "L2"

[[topic]]
name = "rr3-runtime/system/heartbeat"
kind = "notification"
owner = "rr3-runtime"
stable = "L1"
note = "dst_task=0 广播（RR3_BROADCAST_DST_TASK）"

[[topic]]
name = "rr3-runtime/module/state"
kind = "notification"
owner = "rr3-runtime"
stable = "L1"
note = "模块上下线/重启事件，phase 字段置于 payload 内（ADR-0006 §2）"

[[topic]]
name = "rr3-sense/capture/dump"
kind = "request"
owner = "rr3-sense"
stable = "L2"
note = "sense 抓取转储 RPC（rpc.exposes 事务面，request 语义）"

[[topic]]
name = "rr3-act/relay/set"
kind = "request"
owner = "rr3-act"
stable = "L1"
note = "继电器通断指令（0.0.2 方案 Q1 裁定 2026-10-04 立格 act.relay 后 append；legacy/core/relay → rr3-act 迁移映射在册）"

[[topic]]
name = "rr3-power/battery/low"
kind = "event"
owner = "rr3-power"
stable = "L1"
note = "低电阈值事件，rrd 进程内兜底触发前置（architecture §7.3）；负载 schema 见 events/power-battery-low.schema.json"

[[topic]]
name = "rr3-runtime/system/power"
kind = "notification"
owner = "rr3-runtime"
stable = "L2"
note = "低电兜底点名广播（0.0.2 方案 Q4 裁定：rrd 保护动作面之一，dst_task=0 广播）"

[[topic]]
name = "rr3-act/relay/state"
kind = "event"
owner = "rr3-act"
stable = "L2"
note = "继电器通断状态摘要，变化即发（0.0.3 方案 T3 补裁定：意图执行效果的可观测面；0.0.2 Q1 '留真实需要时再 append' 的真实需要此刻成立——e2e 证据链需要状态回读）。负载 schema 见 events/act-relay_state.schema.json"

[[topic]]
name = "rr3-connect/wifi/scan"
kind = "request"
owner = "rr3-connect"
stable = "L1"
note = "WiFi 扫描（0.0.4 方案 D4/Q3 裁定：legacy/core/panel /api/wifi/scan 迁移承接）；sim 后端模拟列表 + backend=sim 诚实标注，板上 NetworkManager cfg 门后置"

[[topic]]
name = "rr3-connect/wifi/connect"
kind = "request"
owner = "rr3-connect"
stable = "L1"
note = "WiFi 配网连接（0.0.4 方案 D4/Q3 裁定：legacy /api/wifi/connect 迁移承接，ssid+pass 密码≥8 位 legacy 语义）；AP 配网状态机 ap→station，凭据由后端承载持久化（MC-6，linux=NetworkManager 连接配置），件内不写文件"

[[topic]]
name = "rr3-connect/wifi/forget"
kind = "request"
owner = "rr3-connect"
stable = "L1"
note = "忘记网络/恢复出厂 WiFi（0.0.4 方案 D4/Q3 裁定：legacy /api/factory_reset 的 WiFi 语义承接）；station→ap，≠ M6 整机恢复出厂（partition-layout 两语义不合并）"

[[topic]]
name = "rr3-sentinel/diag/probe"
kind = "request"
owner = "rr3-sentinel"
stable = "L2"
note = "哨兵探针点名（0.0.7 批E 契约 append 裁定 2026-10-11：F2 门要求 rpc.exposes 主题在册；e2e round-trip 点名对，result.echo 原样回带）"

[[topic]]
name = "rr3-brain/audio/tts_pcm"
kind = "stream"
owner = "rr3-brain"
stable = "L2"
note = "TTS PCM 下行流（0.0.5 第 IV 轮 MCP-1 契约评审 2026-10-12，承 0.0.5 方案 §20 第 1 条选 (a)）：brain 把 TTS 产出 PCM 分帧下发 interact player，播放面从'文本点名+占位波形'升级为真声流（F-4）。载荷体逐字段复用 rr3-sense/audio/pcm 已定形状 {seq, format:'s16le', rate, channels, ms, pcm_b64}（rr3-sense composite.rs 的 rr3_pcm_event_body 为形状事实源），对 TTS 引擎中立——云 CosyVoice2 与本地 Piper（R31 Q3）走同一份通路；上行 audio/pcm 与 audio/vad_start 字节零改动"

[[topic]]
name = "rr3-power/rail/state"
kind = "event"
owner = "rr3-power"
stable = "L2"
note = "电源域电平观测摘要（0.0.5 增补轮六 批N2 件二，ADR-0021 裁定 2）：mv/tier/age_ms 同帧；域压消费走 Rr3Rail trait 本地决策不经总线（同 battery 语义），主题供次级观测面；bare 档经守护输出行呈现、不发本主题"
