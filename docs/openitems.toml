# 开放项数据结构（ADR-0022 裁定 6.3，批N4 件九首笔立）。
#
# 裁定 6.3 原文（docs/process/adr/ADR-0022-*.md 裁定 6 第 3 条）：新增一类开放项
# 数据结构（status.md 的表由它生成，散文不再当唯一载体）：
#   { 条目, 分类: 缺码|无载体, 工单号|触发条件, 证据路径, 状态 }
# 它同时是面板覆盖率门（门 d）的差集落点（谁红着、为什么红、谁负责）。
#
# 与两个既有面的分工（单真值点纪律，谁答什么不混装）：
# - 门 d 差集的**机器真值** = `tools/ci/check.sh` step ⑩ 逐条 " D " 行打印
#   （哪些字段红着，步 ⑩ 说了算；低水位基线 `tools/ci/gate-d-baseline.txt`）；
# - **status.md 敞口表** = 本机无法收口的项与里程碑进度（敞口表章程：缺码＋工单号
#   与无载体证据不许混装一行）；
# - **本表** = 归因登记：每个红项组"为什么红、谁负责（工单号）、证据在哪、现状态"。
#   `fields` 成员清单是登记时的快照（非执法面——成员增减以步 ⑩ 打印为准，
#   本表随转绿同批改状态与清单）。
#
# "status.md 的表由它生成"：生成关系随本表落地后建立（全案 §17 可达终点表行
# "生成关系随 Nn-6.3 落地后建立"）；status.md 现存敞口行迁移不做本批（历史行
# 不改写，新增行按本结构登记）。
#
# 五字段口径（TOML 键 ↔ 裁定字段）：
#   entry    = 条目（组级描述）
#   kind     = 分类（缺码 | 无载体——二选一，裁定 6.3 取值域）
#   owner    = 工单号（谁负责；无工单时写"触发条件"）
#   evidence = 证据路径（机器真值点或 `文件:符号`）
#   status   = 状态（open | done——转绿即 done 并注记提交号）

schema = 1

