[build]
target = "xtensa-esp32-espidf"

[target.'cfg(target_os = "espidf")']
linker = "ldproxy"
rustflags = ["--cfg", "espidf_time64"]

[unstable]
build-std = ["std", "panic_abort"]

[env]
MCU = "esp32"
# 用 Gitee 镜像预克隆好的本地 ESP-IDF v5.5.5（GitHub 直连和 ghfast.top 都不支持 git clone）
# ⚠ 变量名必须是 IDF_PATH（embuild try_from_env 本地源码树分支）；
#   写 ESP_IDF 会被静默忽略，embuild 退回托管模式走 github 重克隆（被墙必挂）
IDF_PATH = "/Users/qianmi/.espressif/esp-idf/v5.5.5"
# 工具装进 ~/.espressif（与 C 固件 v6.1 工具共存），避免 target 目录清理后重复下载
ESP_IDF_TOOLS_INSTALL_DIR = "global"
# 自定义分区表/配置（factory 1984KB，Rust 镜像 ~1.2MB 需要大分区）
ESP_IDF_SDKCONFIG_DEFAULTS = "/Users/qianmi/Documents/trae_projects/my_test/rockrobot3/legacy/firmware-rs/sdkconfig.defaults"
