# relay 装配清单（五件套④）：装配期注入面声明（ADR-0019 修订 1 ③——
# [assemble.handles] 声明件用哪个能力面 trait ← 绑描述符哪个键、[assemble.ops]
# 声明件暴露哪些参数槽 ← 取哪个 config 键；装配段校验缺项即该格 Degraded）。
schema_version = 2

[assemble]
# 通断面经能力面 Rr3GpioOut（role=relay），绑描述符 gpio_relay_line 键
handles = [
  { trait = "Rr3GpioOut", desc_key = "gpio_relay_line" },
]
# 无常量：通断真值随请求给出（§3 注入面"无"，故无 ops 槽）
ops = []
