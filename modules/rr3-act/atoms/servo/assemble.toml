# servo 装配清单（五件套④）：装配期注入面声明（ADR-0019 修订 1 ③——
# [assemble.handles] 声明件用哪个能力面 trait ← 绑描述符哪个键、[assemble.ops]
# 声明件暴露哪些参数槽 ← 取哪个 config 键；装配段校验缺项即该格 Degraded）。
schema_version = 2

[assemble]
# 舵机执行面经能力面 Rr3PwmServo，绑描述符 pwm_chip + pwm_channel 两键（§3 注入面）
handles = [
  { trait = "Rr3PwmServo", desc_key = "pwm_chip" },
  { trait = "Rr3PwmServo", desc_key = "pwm_channel" },
]
# 行程/时限/限速 ← config.toml [rr3-act.servo]（§3 逐槽落位，L-5 补齐；
# 单区间 [angle_limit_deg] 拆上下界两槽，轴由 RR3_HAL_PERIPH_AXIS 选）
ops = [
  { slot = "angle_min_deg", src_key = "rr3-act.servo.angle_limit_deg" },
  { slot = "angle_max_deg", src_key = "rr3-act.servo.angle_limit_deg" },
  { slot = "move_timeout_ms", src_key = "rr3-act.servo.move_timeout_ms" },
  { slot = "state_min_interval_ms", src_key = "rr3-act.servo.state_min_interval_ms" },
]
# 电流需求申报（校验⑨ 申报面，批N2 首件基-36）：act.axis.pwm 是全仓唯一
# kind=power 角色（roles.toml），SG90 类峰值 ~700 mA（全案坑 9 / §3.2 例）。
# Σ(critical=true) 对 rail5v current_cap_ma=2000 的比对读者 = rrd
# rr3_demand_budget_check；sustained_ma / concurrency_group 随门 c（批N2 本体）同批落。
demands = [
  { rail = "rail5v", peak_ma = 700, critical = true },
]
