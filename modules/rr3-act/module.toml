[manifest]
schema_version = 1
name = "rr3-act"
version = "0.0.1"
type = "module"
lang = "rust"
entry = "rr3-act"

[provides]
capabilities = ["act.servo", "act.led", "act.relay"]

[depends]
required = ["bus.publish", "bus.subscribe"]
optional = []

# 反射环（1k–10kHz 闭环）留在本进程内，永不进总线（ADR-0007 裁定 1）：
# 这里只发布 servo/state 摘要与 motor/reflex 异常通告。
[events]
publishes = ["rr3-act/servo/state", "rr3-act/motor/reflex"]
subscribes = ["rr3-brain/intent/result"]

[rpc]
exposes = ["rr3-act/servo/command", "rr3-act/led/effect", "rr3-act/relay/set"]

[resources]
restart_policy = "always"
mem_limit_mb = 48
start_priority = 40

[health]
heartbeat_ms = 1000
watchdog_timeout_ms = 5000
