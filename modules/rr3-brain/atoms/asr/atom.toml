# asr 原子件 manifest（三层 manifest 的 Atom 层，ADR-0019；0.0.5 批C⑤ 原子重铺）
# 契约：base/runtime/rr-registry/src/atom.schema.toml；查册门查 contracts/slots.toml 同一张表
# Rust 面（批N32 件四，ADR-0016 收口）：机制 = mech.rs（WAV 头装配 + multipart
# 请求体纯机制，自 src/cloud.rs ASR 段下沉），入口 = asr.rs，私有头 = private.rs；
# 识别客户端（IO/JSON/密钥策略面）在组合件级 src/cloud.rs 按名委托
schema_version = 1

[atom]
name = "asr"
version = "0.0.1"

[provides]
slots = ["cognition.asr"]   # 语音识别（SenseVoice 适配器，整段 WAV 一次上传；mock 云 R4）

[uses]
slots = []   # 云端端点/凭据走环境变量注入（conventions §3），不占描述符句柄

[events]
publishes = []   # 云端 HTTP 客户端无总线事件流
subscribes = []
