# dialog 装配清单（五件套④）：装配期注入面声明（ADR-0019 修订 1 ③——
# [assemble.handles] 声明件用哪个能力面 trait ← 绑描述符哪个键、[assemble.ops]
# 声明件暴露哪些参数槽 ← 取哪个 config 键；装配段校验缺项即该格 Degraded）。
schema_version = 2

[assemble]
# 纯内存状态机（组合件构造即用），无接入句柄
handles = []
# 一轮 utterance 时长上限 ← config.toml [rr3-brain.dialog]（§3）
ops = [
  { slot = "max_utterance_ms", src_key = "rr3-brain.dialog.max_utterance_ms" },
]
