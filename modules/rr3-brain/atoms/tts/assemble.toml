# tts 装配清单（五件套④）：装配期注入面声明（ADR-0019 修订 1 ③——
# [assemble.handles] 声明件用哪个能力面 trait ← 绑描述符哪个键、[assemble.ops]
# 声明件暴露哪些参数槽 ← 取哪个 config 键；装配段校验缺项即该格 Degraded）。
schema_version = 2

[assemble]
# 云端端点/凭据走环境变量注入（conventions §3），不占描述符句柄
handles = []
# 模型名/端点/超时 ← config.toml [rr3-brain.cloud]（§3）
ops = [
  { slot = "tts_model", src_key = "rr3-brain.cloud.tts_model" },
  { slot = "base_url", src_key = "rr3-brain.cloud.base_url" },
  { slot = "timeout_s", src_key = "rr3-brain.cloud.timeout_s" },
]
