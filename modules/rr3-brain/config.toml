# rr3-brain 运行期配置
# 铁律：密钥 / token 一律走环境变量（RR3_CLOUD_API_KEY，通用键名——供应商由本段
# base_url/模型名承载，0.0.5 批M MC-8②），本文件不落任何凭据。
# 逐行来源：legacy/core/{asr,llm,tts}/src/*_config.h 中曾硬编码密钥，迁移时改为读环境。

[rr3-brain]
log_level = "info"

[rr3-brain.cloud]
# base_url 是主机根：客户端自拼 /v1/<路径>（tests/test_cloud.py 假端点同契约）。
# 写成带 /v1 的 API 根会拼出 /v1/v1/... 必 404——真云冒烟（C4）前修正。
base_url = "https://api.siliconflow.cn"
asr_model = "iic/SenseVoiceSmall"
llm_model = "deepseek-ai/DeepSeek-V3"
tts_model = "FunAudioLLM/CosyVoice2-0.5B"
timeout_s = 20

# 模型连接表（0.0.6 抽象批，LLM 腿）：每行一个连接，填"格式/地址/模型名"即可接
# 任意云端或本地 OpenAI 兼容服务（DeepSeek 官方 / SiliconFlow / Ollama…），换云
# 只改配置不改码。字段：mode = api|local；api_format 本批仅 openai（anthropic
# 预留）；api_key_ref 双源引用——`env:变量名` → 环境变量，裸名 → 面板维护的
# secrets 文件（~/.rr3/secrets.json，0600，仓外；RR3_SECRETS_FILE 可改路径）。
# 铁律不变：密钥值不进本文件、不进代码/仓库；active 全表恰一行（解析器强制）。
[[rr3-brain.model]]
name = "DeepSeek官方"
mode = "api"
api_format = "openai"
base_url = "https://api.deepseek.com"
model_id = "deepseek-chat"
api_key_ref = "DeepSeek官方"
active = true

[rr3-brain.dialog]
# 0.0.5 批I B-2：silence_tail_ms 删除（死参数——dialog.py 从不读它，判停完全
# 依赖 sense 的 Offset 边沿；留键会让人以为它在生效）。
# 0.0.5 批I B-8：max_turn_chars 删除（在册无读者；实装截断随真用例回归）。
# 一轮 utterance 的时长上限：连续语音无 offset 边沿时也要有界
# （继承 legacy asr_begin(max_seconds) 的精神，ADR-0014 裁定 3）
max_utterance_ms = 8000
