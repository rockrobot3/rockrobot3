[manifest]
schema_version = 1
name = "rr3-brain"
version = "0.0.1"
type = "brain"
lang = "python"
# 打包时由 base/os/buildroot/package/rr3-brain 安装同名 shim，实际执行 `python -m rr3_brain`
# （naming.md §3：目录名 == 进程名 == manifest.name）
entry = "rr3-brain"

[provides]
capabilities = ["cognition.dialog", "cognition.asr", "cognition.llm", "cognition.tts"]

[depends]
required = ["bus.subscribe", "bus.rpc", "net.online"]
optional = ["power.battery"]

# brain 只走事务面与意图事件：ASR/LLM/TTS 编排是云端往返，不进反射路径
# （ADR-0007 控制面三级分层）。密钥一律构建期环境变量注入，不落盘、不入库。
# C14（ADR-0019 修订 2 ②，2026-10-10 评审裁定）：订阅面对齐实然面——
# asr/text 走 retired（号位保留、义务解除）、net/link 撤申报（不补实现）；
# pcm + vad_start 是 composite.py 实际消费的语音主链入口（B-1 只增补齐）。
# MC-1（TTS 下行通路）：新增发布面 rr3-brain/audio/tts_pcm（stream）——brain 把
# TTS 合成结果按 20ms 块分帧广播；rr3-interact 订阅消费后经事务面点名播放。
[events]
publishes = ["rr3-brain/intent/result", "rr3-brain/audio/tts_pcm"]
subscribes = ["rr3-sense/audio/pcm", "rr3-sense/audio/vad_start"]

[rpc]
exposes = ["rr3-brain/llm/completion"]

[resources]
restart_policy = "on-failure"
mem_limit_mb = 256
start_priority = 80

[health]
heartbeat_ms = 2000
watchdog_timeout_ms = 10000
