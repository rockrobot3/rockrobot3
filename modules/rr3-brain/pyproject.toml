[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rr3-brain"
version = "0.0.1"
description = "RockRobot3 认知模块：ASR/LLM/TTS 编排与对话策略"
requires-python = ">=3.12"
# M4 接云端时再声明运行期依赖（httpx 等）；v0.0.1 骨架必须零第三方依赖可导入
dependencies = []

[project.scripts]
rr3-brain = "rr3_brain.__main__:main"

[tool.setuptools.packages.find]
include = ["rr3_brain*"]
