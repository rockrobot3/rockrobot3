[package]
name = "rr3-connect"
version = "0.0.1"
edition = "2021"
license = "UNLICENSED"
publish = false

# 独立工程：modules/ 不在 base/runtime workspace 内
[workspace]

[[bin]]
name = "rr3-connect"
path = "src/main.rs"

[dependencies]
# 总线与 HAL：path 依赖（勿用 crates.io 同名包）
rr-ipc = { path = "../../base/runtime/rr-ipc" }
rr-bus = { path = "../../base/runtime/rr-bus" }
rr-hal = { path = "../../base/runtime/rr-hal" }
serde_json = "1"
toml = "0.8"
