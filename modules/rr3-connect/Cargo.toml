[package]
name = "rr3-connect"
version = "0.0.1"
edition = "2021"
license = "UNLICENSED"
publish = false

# 独立工程：modules/ 不在 base/runtime workspace 内
[workspace]

[[bin]]
name = "rr3-connect"
path = "src/main.rs"

[dependencies]
# 总线与 HAL：path 依赖（勿用 crates.io 同名包）。rr-hal-api = 能力面契约 crate
# （基-35/⑨-w）：契约符号一律走 rr_hal_api；rr-hal 边仅为装配函数 + sim/配网承载
# 保留（白名单由 check.sh 步 ⑨-w 冻结执法，Cargo 级拆边需装配上移，敞口在册）。
rr-ipc = { path = "../../base/runtime/rr-ipc" }
# 模块公共骨架（0.0.8 W-A 批0/批2）：bootstrap 收敛序列 + serve 主循环 + Dispatcher
rr3mod = { path = "../../base/runtime/rr3mod" }
# 总线承载契约面（基-35 窄化②/批N9 件一）：承载客户端走 rr_bus_api；语义常量直引
# rr-core（真值单点，不经 re-export 中介）。
rr-bus-api = { path = "../../base/runtime/rr-bus-api" }
rr-core = { path = "../../base/runtime/rr-core" }
rr-hal = { path = "../../base/runtime/rr-hal" }
rr-hal-api = { path = "../../base/runtime/rr-hal-api" }
serde_json = "1"
toml = "0.8"
