# bt 原子件 manifest（三层 manifest 的 Atom 层，ADR-0019；0.0.5 批C④ 原子重铺）
# 契约：base/runtime/rr-registry/src/atom.schema.toml；查册门查 contracts/slots.toml 同一张表
schema_version = 1

[atom]
name = "bt"
version = "0.0.1"

[provides]
slots = ["net.bt"]   # 蓝牙链路状态机骨架（0.0.4 批E，D5/Q5）；BlueZ 真后端板上后置（cfg 门）

[uses]
slots = []   # 骨架期无注入面；真后端（BlueZ cfg 门）接线归板上批次

[events]
publishes = []   # 主题不登记（D5 裁定：btctl 语义已被日志环 + rr3-ctl 承接），启用事件面前先改 contracts/topics.toml
subscribes = []
