# rr3-connect 运行期配置
# 铁律：任何凭据/PSK/token 都不写在这里，只走环境变量（conventions §3）。
# SSID/密码属用户数据，运行期由 NetworkManager 侧持有，本模块不持久化。
#
# 0.0.5 批I 孤儿参数清零（N-2/N-6）：删除无读者的 roam_probe_enabled、
# tls_min_version（真 TLS 随 ADR-0016 Rust 化落进真 HTTP 客户端配置时再进册）、
# 与总段 log_level；timeout_ms 迁入 wifi 段并实装生效点 = nmcli 子进程超时。

[rr3-connect.wifi]
link_report_period_ms = 5000
timeout_ms = 20000          # nmcli 子进程超时（N-2 实装：管住 net/link 最坏翻转延迟）

[rr3-connect.bt]
up = false                  # 开机蓝牙初值（出厂不自动开；0.0.5 批I N-1：env 注入退役改数据化注入）
