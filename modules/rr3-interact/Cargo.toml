[package]
name = "rr3-interact"
version = "0.0.1"
edition = "2021"
license = "UNLICENSED"
publish = false

# 独立工程：modules/ 不在 base/runtime workspace 内
[workspace]

[[bin]]
name = "rr3-interact"
path = "src/main.rs"

[dependencies]
# path 依赖进仓内三件套（勿用 crates.io 同名包）；serde_json 用具体版本——
# 本 crate 是独立 workspace，吃不到 base/runtime 的 workspace 继承
rr-ipc = { path = "../../base/runtime/rr-ipc" }
rr-bus = { path = "../../base/runtime/rr-bus" }
rr-hal = { path = "../../base/runtime/rr-hal" }
serde_json = "1"
