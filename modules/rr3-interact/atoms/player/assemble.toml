# player 装配清单（五件套④）：装配期注入面声明（ADR-0019 修订 1 ③——
# [assemble.handles] 声明件用哪个能力面 trait ← 绑描述符哪个键、[assemble.ops]
# 声明件暴露哪些参数槽 ← 取哪个 config 键；装配段校验缺项即该格 Degraded）。
schema_version = 2

[assemble]
# 播放面经能力面 Rr3AudioSink，绑描述符 alsa_device 键（§3 注入面）
handles = [
  { trait = "Rr3AudioSink", desc_key = "alsa_device" },
]
# 预缓冲/音量（§3）目前无 config 键读者（批I I-1 已删键），故无 ops 槽——
# 真件实装时按"音量/预缓冲进 ops 槽"回归（§3 逐槽落位）
ops = []
