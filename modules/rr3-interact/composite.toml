# rr3-interact 组合件装配清单（三层 manifest 的 Composite 层，0.0.5 批C③ 原子重铺）
# 方案 §9：Composite 声明"装配了哪些原子件（⊗ 链）+ 落为哪种执行单元"。
# 机器校验已接线（0.0.5 增补轮六 批N1 N-11）：rr-registry composite.rs 按本形状
# fail-closed 校验。schema_version 归组合件面版本域（RR3_COMPOSITE_SCHEMA_VERSION = 1，
# 与件级 assemble.toml 的 RR3_ASSEMBLE_SCHEMA_VERSION = 2 同名不同域，不互认不迁移）；
# 本轮增 handles/ops/no_injection 三键属首次定形只增不 bump（落位时无代码读本文件，
# 校验器与数据同批落盘，不存在旧数据带病运行窗口）。
# owner 级契约 module.toml 功能守恒不动（architecture.md §4.1 注记）。
schema_version = 1

[composite]
name = "rr3-interact"
unit = "process"   # 执行单元：独立进程（module.toml entry=rr3-interact）

[assemble]
atoms = ["face", "player"]   # face ⊗ player（⊗=装配期、执行单元内函数调用，ADR-0019 裁定 2）
# 组合件申报面（N-11，§8 门 j 前件）：句柄/参数槽结构与件级同形同规则（composite.rs
# 共用件级 helper）；两数组均空必须明写 no_injection = true（L-5 同一条判据）。
# 参数槽随消费落地增补（批N4 件五 I-17/I-18② 首批七槽：表情节拍＋自检期望表情
# ＋面板五限额——消费点在组合件面（主循环节拍/panel server），无原子件对应，
# 故走组合件级申报；face 的兜底表情槽走件级 face/assemble.toml）。
handles = []
ops = [
  # 表情节拍 ← [rr3-interact.face] face_tick_ms（I-17/M-2：主循环节步频数据化，legacy 250）
  { slot = "face_tick_ms", src_key = "rr3-interact.face.face_tick_ms" },
  # 自检期望表情 ← [rr3-interact.selftest] face_expect（I-17/M-10：产线取向可配，legacy happy）
  { slot = "selftest_face_expect", src_key = "rr3-interact.selftest.face_expect" },
  # 面板五限额 ← [rr3-interact.panel]（I-18②："现场限并发只能改码"的无主策略清账）
  { slot = "panel_max_conns", src_key = "rr3-interact.panel.max_conns" },
  { slot = "panel_read_timeout_ms", src_key = "rr3-interact.panel.read_timeout_ms" },
  { slot = "panel_header_limit", src_key = "rr3-interact.panel.header_limit" },
  { slot = "panel_body_limit", src_key = "rr3-interact.panel.body_limit" },
  { slot = "panel_call_timeout_ms", src_key = "rr3-interact.panel.call_timeout_ms" },
]
