# battery 原子件 manifest（三层 manifest 的 Atom 层，ADR-0019；0.0.5 批B③ 打样）
# 契约：base/runtime/rr-registry/src/atom.schema.toml；查册门查 contracts/slots.toml 同一张表
schema_version = 1

[atom]
name = "battery"
version = "0.0.1"

[provides]
slots = ["power.battery"]   # 电池读数格（base 层，恒在位）

[uses]
slots = []           # 电池读数当前经 rr-hal 电源面直取；描述符句柄化归批D 对表

[events]
publishes = ["rr3-power/battery/state", "rr3-power/battery/low", "rr3-power/battery/ok"]
subscribes = []
