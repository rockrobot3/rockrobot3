# rr3-power 运行期配置（secret 一律走环境变量，不落盘）
# 关断阈值是本地安全决策的输入，不依赖总线可达（architecture §7.3）。
# 0.0.5 批I P-6：[rr3-power] log_level 删除（解析函数不读、全仓无读者——
# 被读或删除，选删除，与 I-1/N-6/B-2/B-8 同纪律）。

[rr3-power.battery]
sample_period_ms = 5000
low_voltage_mv = 3300
cutoff_voltage_mv = 3150

[rr3-power.charger]
state_period_ms = 2000
