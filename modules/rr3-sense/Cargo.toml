[package]
name = "rr3-sense"
version = "0.0.1"
edition = "2021"
license = "UNLICENSED"
publish = false

# 独立工程：modules/ 不在 base/runtime workspace 内
[workspace]

[[bin]]
name = "rr3-sense"
path = "src/main.rs"

[features]
# 板上原生构建开关（0.0.6 批F1，R13）：透传 rr-hal 的 ALSA 后端。宿主 musl 交叉**不带**
# （musl 全静态与 alsa 结构性互斥）→ 板上默认 sim；板上 `--features alsa` 构建带真后端
# （须先装 libasound2-dev + pkg-config）。非 linux 平台开此 feature 是 no-op（rr-hal 依赖门）。
alsa = ["rr-hal/alsa"]

[dependencies]
# path 依赖进仓内三件套（勿用 crates.io 同名包）；serde_json/toml 用具体版本——
# 本 crate 是独立 workspace，吃不到 base/runtime 的 workspace 继承
rr-ipc = { path = "../../base/runtime/rr-ipc" }
rr-bus = { path = "../../base/runtime/rr-bus" }
# 能力面契约 crate（基-35/⑨-w）：契约符号一律走 rr_hal_api；rr-hal 边仅为装配
# 函数与 Rr3PcmStream 承载类型保留（白名单由 check.sh 步 ⑨-w 冻结执法，Cargo 级
# 拆边需装配上移，敞口在册）。
rr-hal = { path = "../../base/runtime/rr-hal" }
rr-hal-api = { path = "../../base/runtime/rr-hal-api" }
serde_json = "1"
toml = "0.8"

# —— espidf 档编译面（批N8 件三，MC-7 半边：rr3-act/rr3-sense 非 linux 目标构建）——
# 照 tools/espidf-sentinel 先例（xtensa-esp32-espidf + build-std + esp-idf-sys），但
# 本 crate 是**双档工程**（宿主 linux 档照常进 ④/⑥ 扫面）：espidf 专属依赖挂 target
# 表（同 rr-hal 的 alsa 先例），宿主构建不解析、零扰动；编译面由专用门
# tools/ci/rr3-act-sense-espidf-check.sh 执法（SKIP 纪律同 espidf-sentinel-check.sh）。
# 版本组合对表批W1 钉死登记（tools/espidf-std-hello/README.md）：
# esp-idf-sys =0.35.0 ↔ ESP-IDF v5.2.2 ↔ embuild =0.32.0 ↔ ldproxy 0.3.5。
[target.'cfg(target_os = "espidf")'.dependencies]
esp-idf-sys = { version = "=0.35.0", features = ["binstart"] }

[build-dependencies]
# 链接参数接力（build.rs）：esp-idf-sys 的 cargo:rustc-link-arg 只作用于它自己包内
# bins 面，根 crate 必须经 DEP_ESP_IDF_* 元数据自行取回并转发（官方 esp-idf-template
# 同款 build.rs，espidf-sentinel 同源）。**不可挂 espidf target 表**——cargo 对
# build-dependencies 的 cfg 按 host 三元组判（build script 恒 host 编译），挂表即
# embuild 缺席 build.rs；宿主构建不碰 espidf 逻辑由 build.rs 的 TARGET 护栏把守
# （embuild 是纯 Rust crate，宿主多编译一次无害）。
embuild = "=0.32.0"
