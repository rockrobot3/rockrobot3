# capture 装配清单（五件套④）：装配期注入面声明（ADR-0019 修订 1 ③——
# [assemble.handles] 声明件用哪个能力面 trait ← 绑描述符哪个键、[assemble.ops]
# 声明件暴露哪些参数槽 ← 取哪个 config 键；装配段校验缺项即该格 Degraded）。
schema_version = 2

[assemble]
# 音频源经能力面 Rr3AudioSource 直取，绑描述符 alsa_device 键（§3 注入面）
handles = [
  { trait = "Rr3AudioSource", desc_key = "alsa_device" },
]
# 采样率/声道/节拍 ← config.toml [rr3-sense.audio]（§3 逐槽落位，L-5 补齐）
ops = [
  { slot = "sample_rate", src_key = "rr3-sense.audio.sample_rate" },
  { slot = "channels", src_key = "rr3-sense.audio.channels" },
  { slot = "frame_ms", src_key = "rr3-sense.audio.frame_ms" },
]
