# rr3-sense ESP32 板麦档（A 批 c5）：板面 esp32-periph-base 双通道 16k/20ms，
# 采集参数与固件侧同源；VAD/DoA 能量门按板麦实测口径独立标定（非默认档
# 1500——板端数字增益 ×8 与宿主真麦灵敏度不同源，两档各按各的实录走）。
# 装载方式：RR3_SENSE_CONFIG=<repo>/modules/rr3-sense/config-esp32.toml 显式 env
# （经 rrd 继承进 sense）；不动仓库默认 config.toml——默认档仍是宿主单麦。
# channels=2 走 R14 双麦期语义：DoA 吃原始双通道、总线承载下混 mono（brain 零改动）。

[rr3-sense.audio]
sample_rate = 16000
channels = 2
frame_ms = 20        # <1 无节拍意义，模块侧收敛 20 并留痕

[rr3-sense.vad]
rms_start = 650        # 起音阈值（2026-11-01 傍晚四订，批N37 现场重标：整机换位 +
                       # 独立电源环境 42s 分段实录（15s 静 + 25s 说，rms_probe.py）——
                       # 安静段 584–661（主体 585±3，两个 653/661 小尖），语音帧
                       # 728–1131（峰值 ~1100，词间停顿回落 586–600）。阈 500 已被
                       # 底噪 585 整体淹没（VAD 永远看不到安静＝结构失效），650 取
                       # 底噪余量 1.10×/语音余量 1.12–1.74× 均衡点（10-21 同款取法）；
                       # 词间停顿 600 < 650 ⇒ silence_tail 400 可正常判停。
                       # 500 旧档（2026-10-31 深夜：安静均值 380/语音 500–660 环境已
                       # 因整机换位失效）；更早 650/750/800 与 700 档注释见 git 历史。）
silence_tail_ms = 400   # 判停尾静音（2026-10-31 深夜三订：S3 实机噪声下
                        # "低于 rms_start=500 的最长连续安静段"仅 620ms（30s 实录：
                        # below 480 的 max_run=640ms、below 350 也只有 380ms），
                        # 700ms 永远等不到 → VAD 一旦进入 in_speech 就锁死，utterance
                        # 只能靠 brain 8s 封顶硬切，ASR 拿到噪声混合段返回空/乱码。
                        # 400ms < 实测最长安静段，自然停顿可判停；句内短于 400ms 的
                        # 换气不切段。旧 700/1200 档注释保留于 git 历史。2026-11-01
                        # 复核：阈 650 下词间停顿 586–600 全段 < 阈，400 维持。）
min_speech_ms = 200

[rr3-sense.doa]
bin_threshold_deg = 30  # DoA 三档边界（S-5：阈值数据化，件内常量已迁出）
window_ms = 1000        # 判向窗长（B批 b3b TDOA：onset 时 ring 回看窗整窗互相关）
window_rms_min = 650    # 窗能量门（任一采集帧 rms ≥ 此值才算有声窗；与 vad.rms_start
                        # 同口径（2026-11-01 批N37 随 vad.rms_start 同调 650，10-31
                        # 深夜 500 档已被底噪 585 淹没）——onset 路径恒过，防非
                        # onset 直调与全静音窗）
mic_baseline_mm = 150   # 双麦间距（物理 lag 上限 = round(sr·基线/声速) ≈ ±7 样本，
                        # sinθ 反演的几何量；与 b3a 实测安装同源）

# B批 b2 听声识位反射环（裁定①快环落 sense；命令旁路仅 esp32 档音频源承载——
# 默认档不落此段，代码缺省 enable=false，行为与旧版逐点等价）
[rr3-sense.reflex]
enable = true
deadband_deg = 10       # 判向死区：正前方 ±10° 内不转头（免抖动）
gate_tail_ms = 1000     # TTS 帧流停后门保持开的尾窗（扬声器回声拖尾）
gate_gap_ms = 500       # tts_pcm 帧间隔超过此值判新一轮播放（累计重置）
# 转完点头（0.0.8 批）：pan 到位后 tilt 做一手势——先回中位（蓄势），再上仰
# nod_deg。注意 tilt 行程 [80,100]、中位 90，boot 姿态已在中位 +8（98），
# 故"上仰"的可见行程由"回中位 → 抬回 +8"两段构成（回位差 8° 即手势幅度）。
nod_deg = 8             # 相对中位的上仰角（0 = 不做手势）；98 = boot 同高，留 2° 余量
nod_delay_ms = 500      # pan 下发后等到位（pan 30° 约 300ms + 余量）
nod_hold_ms = 200       # 蓄势位驻留（手势可见性）
