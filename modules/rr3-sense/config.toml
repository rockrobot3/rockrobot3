# rr3-sense 运行期配置（由模块自己读取；secret 一律走环境变量，不落盘）
# 阈值继承 legacy/main.c 的对话策略，改参数不碰源码（naming.md §4）。
# 0.0.5 批I S-1：[rr3-sense] log_level 删除（全仓无读者——被读或删除，选删除，
# 与 P-6/N-6/I-1/B-8 同纪律）；本文件改为缺省装载（env 覆盖优先，与 power/connect
# 同口径），生效来源随启动日志写明。

[rr3-sense.audio]
sample_rate = 16000
channels = 1
frame_ms = 20        # <1 无节拍意义，模块侧收敛 20 并留痕

[rr3-sense.vad]
rms_start = 1500        # 起音阈值
silence_tail_ms = 700   # 判停尾静音
min_speech_ms = 200

[rr3-sense.doa]
bin_threshold_deg = 30  # DoA 三档边界（S-5：阈值数据化，件内常量已迁出）
window_ms = 1000        # 判向窗长（B批 b3b TDOA：onset 时 ring 回看窗整窗互相关）
window_rms_min = 1500   # 窗能量门（与 vad.rms_start 同口径——onset 路径恒过，
                        # 防非 onset 直调与全静音窗；esp32 档随其 vad 阈 800 另配）
mic_baseline_mm = 150   # 双麦间距（b3a 实测安装同源；单麦档无 ring 不消费，
                        # 键在册只为装配注入完备——contract 注入缺拦下的 b3b 遗漏）
