# RockRobot3 装配单：default 机型（RK3566 参考机，ADR-0012 裁定 3）
# 纯数据、零逻辑：rrd 启动装配链读它 + 硬件探测做匹配（缺格置 Degraded），
# 不写启动序（那是 ADR-0009 拓扑仲裁的输出），不写"怎么启动"（那是 rrd 的机制）。
# 门禁（ADR-0012 裁定 5②）：[bindings]/[enabled_slots]/[slots].present 引用的格位必须命中
# contracts/slots.toml，绑定的件必须是 modules/ 在册模块——由 rr-registry 契约测试在 CI 全集层判。
# schema_version = 2（0.0.5 批J，ADR-0018 修订 1 ④ 描述符七段定形）：新增
# [platform]/[supplies]/[slots] 三必填段，1→2 为破坏性变更。
# schema_version = 3（0.0.5 增补轮六批N1，§4.2 [pins] 定形）：[[pin]] 物理绑定段进场、
# 引脚侧键自 [hardware] 下移为 [pins] 派生视图（门 n 注入路径唯一，power P-13）——
# 批N3 件六起 SPI 词形同轨（spi_device 由 controller+channel 派生），[hardware] 只留
# 两非引脚键（alsa_device/link_ifname），role 外键查册 contracts/roles.toml，
# 2→3 为破坏性变更。
# schema_version = 4（0.0.5 增补轮六批N2，校验⑩ 定形）：[supplies.budget] 内存预算
# 子段进场（⑩-a/⑩-b 分母，ADR-0021 修订 3"栈/堆预算不住 platform 表"）——新必填段
# 随版本 bump（批N1 [[supplies.domain]] 先例），3→4 为破坏性变更。

schema_version = 4

[os]
route = "distro" # distro | buildroot（双轨见 ADR-0013）

[platform]
# 平台档位（ADR-0018 修订 1：host / rtos / bare 三档）。参考机跑完整 Linux 底座 = host。
tier = "host"
# 平台事实表外键（§4.6，批N1 基-22）：校验③④⑤⑧按它选 contracts/platform/rk3566.toml
# （演练实例，取值待器件核对——status.md 敞口在案）。
chip = "rk3566"

[supplies]
# 平台供给声明（ADR-0018 修订 4 ② 看门狗三键 + 修订 2 ③ 时序预算位三键）。
# watchdog_timeout_ms = 15000 > 模块级 health.watchdog_timeout_ms = 10000（平台兜底更宽）；
# tick_period_ms = 200 与 rrd watchdog tick 生产真值同源（rrd tick 环 200ms）；
# tick_jitter_ms / safety_core_interval_ms 为**声明预算位**（修订 2 ③）——
# 声明值与生产真值的对账归 0.0.6 点验矩阵，此处先按预算登记。
watchdog_present = true
watchdog_timeout_ms = 15000
watchdog_feeder = "rrd"
tick_period_ms = 200
tick_jitter_ms = 100
safety_core_interval_ms = 1000

# [[supplies.domain]] 电力网络声明（第七供给位，schema 3，增补轮六 §3.1/§5 校验⑥）。
# 阈值/上限为**声明预算位**（演练实例，全案 §4.1b"取值待器件"：RK3566 只能先给演练
# 实例记敞口；5V 轨阈值与板 crate board.rs RAIL_*_MV 占位同源），对账归批N2 门 c；
# 全域 armed=false（未标定即不武装，§3.1 降级语义——armed=true 须有测点 + 龄期上界）。
# 三个绑定引用位一律写 pin_id（⑥-d），无对象显式写 "none"。
[[supplies.domain]]
name = "batt"
nominal_mv = 3700
mild_mv = 3500
severe_mv = 3300
current_cap_ma = 2000
sense = "power.battery.meter" # pin_id 外键（INA219 在位，[pins] meter 条目）
current_sense = "none"
switch = "none"
switchable = false
armed = false
max_age_ms = 0

[[supplies.domain]]
name = "rail5v"
nominal_mv = 5000
mild_mv = 4600
severe_mv = 4400
current_cap_ma = 2000
sense = "none"
current_sense = "none"
switch = "none"
switchable = false
armed = false
max_age_ms = 0

[[supplies.domain]]
name = "rail3v3"
nominal_mv = 3300
mild_mv = 3100
severe_mv = 3000
current_cap_ma = 600
sense = "none"
current_sense = "none"
switch = "none"
switchable = false
armed = false
max_age_ms = 0

# [supplies.budget] 内存预算声明（校验⑩ 分母，schema 4，ADR-0021 修订 3：栈/堆预算
# 不住 platform 表，住 [supplies].budget——三份数据三个主人）。host 档校验⑩ 不适用，
# "合法不适用"显式写 true 不许留空（F-6）；数字预算键与 not_applicable = true
# 互斥（并存 = 自相矛盾红，装载期 parse 层裁）。
[supplies.budget]
not_applicable = true

[bindings]
# 格位 → 件。基础层（slots.toml layer=base）由基座内建承载，不在此绑定；
# 本节绑定全部身体层与认知层格位（16 格，default 机不留缺格）。
"act.servo" = "rr3-act"
"act.led" = "rr3-act"
"act.relay" = "rr3-act"
"net.wifi" = "rr3-connect"
"net.bt" = "rr3-connect"
"ui.face" = "rr3-interact"
"audio.playback" = "rr3-interact"
"audio.capture" = "rr3-sense"
"audio.vad" = "rr3-sense"
"sensor.env" = "rr3-sense"
"sensor.imu" = "rr3-sense"
"power.charger" = "rr3-power"
"cognition.dialog" = "rr3-brain"
"cognition.asr" = "rr3-brain"
"cognition.llm" = "rr3-brain"
"cognition.tts" = "rr3-brain"

[hardware]
# 非引脚键直给（schema 3，增补轮六 §4.2）：设备名/接口名类标量——rrd 装配链读本段
# 序列化注入 RR3_HAL_BINDINGS，rr-hal 据此实例化后端；RR3_HAL_* env 降为应急覆盖；
# 代码缺省 fail-closed，不回落任何一块板的引脚。引脚侧键（含批N3 件六 SPI 词形
# spi_device）已下移 [[pin]] 派生（门 n：[hardware] 出现引脚侧派生键即拒 boot）；
# 本段取值 = 现参考机真值（runbook 件 4 wlan0）。换板/换装配 = 只改本段与 [[pin]]，
# 不改代码。
alsa_device = "default"
link_ifname = "wlan0"

[[pin]]
# 物理绑定真值点（schema 3，增补轮六 §4.2：引脚侧唯一事实源，role 外键 →
# contracts/roles.toml）。rrd 装载按 host 档派生器合成 pwm_chip/pwm_channel 等注入键
# （取值语义见 roles.toml 注记：pwm<N> 派生 pwm_chip=N）；"合法不适用"显式写 none，
# 留空即红（§5 缺失语义）。取值 = 现参考机真值（R22 定案档 pwm0=GPIO12、R8 预算表
# GPIO4/17 软件路行、接线 3 i2c1、BOM #5 INA219@0x40）。
role = "act.axis.pwm"
instance = "pan"
controller = "pwm0"
channel = 0
physical = [12]
direction = "out"
rail = "rail5v"
failsafe = "release"
mux_group = []

[[pin]]
role = "act.led.gpio"
controller = "gpiochip0"
physical = [4]
direction = "out"
rail = "none" # 信号侧控制线（负载电流在 LED 模组内），无可切轨
failsafe = "hold"
mux_group = []

[[pin]]
role = "act.relay.gpio"
controller = "gpiochip0"
physical = [17]
direction = "out"
rail = "none" # 通断控制线（被切负载归 domains 侧管，批N2）
failsafe = "driven_low"
mux_group = []

[[pin]]
role = "power.battery.meter"
controller = "i2c1"
addr = "0x40" # 七位从地址（0x 前缀十六进制）
device = "INA219" # 器件型号词（外键 → devices.toml；③-c 共址对账的身份字段）
direction = "in"
mux_group = []

[[pin]]
# SPI 显示面（批N3 件六拆格，敞口 18 行收口）：spidev0 = 总线 0、channel = 0 =
# 片选 0，装载期派生合成 spi_device="/dev/spidev0.0"（链④真件档 MAX7219 双位模块
# 接 SPI0 CE0，接线 4：DIN=脚19/CS=脚24/CLK=脚23；与 distro 同板同引脚逐值一致）。
role = "ui.face.spi"
controller = "spidev0"
channel = 0
direction = "out"
mux_group = []

# —— 批N3 件八（器件角色进场）：charger 与 battery.meter 共用同一 INA219 读数源
# （P-5 裁定：同 (i2c1, 0x40) 同 device 共址合法，校验③-c 精化判据的正例形状；
# derives=[] 不派生注入键——读数面句柄仍是 battery.meter 一份，无第二真值点）。
# env/imu 两格 status=placeholder（升格等真后端，D9），角色面先行 + probe 探测面
# 生效：bus/addr 进 pin 即被器件级在位探测消费（L-14）；演练实例取值待器件核对
# （与 devices.toml 演练行对表——SHTC3@0x70、ICM-42688@0x68，AD0 接地）。
[[pin]]
role = "power.charger.meter"
controller = "i2c1"
addr = "0x40"
device = "INA219"
direction = "in"
mux_group = []

[[pin]]
role = "sensor.env.meter"
controller = "i2c1"
addr = "0x70"
device = "SHTC3"
direction = "in"
mux_group = []

[[pin]]
role = "sensor.imu.meter"
controller = "i2c1"
addr = "0x68"
device = "ICM-42688"
direction = "in"
mux_group = []

[enabled_slots]
# 模块 → 本形态启用的格位集合。default 机各模块启用其 manifest provides 全集；
# 换机型裁剪模块能力面 = 只改本文件，不改代码。
rr3-act = ["act.servo", "act.led", "act.relay"]
rr3-connect = ["net.wifi", "net.bt"]
rr3-interact = ["ui.face", "audio.playback"]
rr3-sense = ["audio.capture", "audio.vad", "sensor.env", "sensor.imu"]
rr3-power = ["power.battery", "power.charger"]
rr3-brain = ["cognition.dialog", "cognition.asr", "cognition.llm", "cognition.tts"]

[slots]
# 本板物理在位格位声明（ADR-0018 修订 1 ④ 七段之一；缺格三源合一第一源——声明缺）。
# 基础层由基座内建承载、恒在位，不进本声明；参考机 16 格全在位，升序排列。
present = [
    "act.servo",
    "act.led",
    "act.relay",
    "audio.capture",
    "audio.playback",
    "audio.vad",
    "cognition.asr",
    "cognition.dialog",
    "cognition.llm",
    "cognition.tts",
    "net.bt",
    "net.wifi",
    "power.charger",
    "sensor.env",
    "sensor.imu",
    "ui.face",
]
