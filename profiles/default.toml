# RockRobot3 装配单：default 机型（RK3566 参考机，ADR-0012 裁定 3）
# 纯数据、零逻辑：rrd 启动装配链读它 + 硬件探测做匹配（缺格置 Degraded），
# 不写启动序（那是 ADR-0009 拓扑仲裁的输出），不写"怎么启动"（那是 rrd 的机制）。
# 门禁（ADR-0012 裁定 5②）：[bindings]/[enabled_slots]/[slots].present 引用的格位必须命中
# contracts/slots.toml，绑定的件必须是 modules/ 在册模块——由 rr-registry 契约测试在 CI 全集层判。
# schema_version = 2（0.0.5 批J，ADR-0018 修订 1 ④ 描述符七段定形）：新增
# [platform]/[supplies]/[slots] 三必填段，1→2 为破坏性变更。

schema_version = 2

[os]
route = "distro" # distro | buildroot（双轨见 ADR-0013）

[platform]
# 平台档位（ADR-0018 修订 1：host / rtos / bare 三档）。参考机跑完整 Linux 底座 = host。
tier = "host"

[supplies]
# 平台供给声明（ADR-0018 修订 4 ② 看门狗三键 + 修订 2 ③ 时序预算位三键）。
# watchdog_timeout_ms = 15000 > 模块级 health.watchdog_timeout_ms = 10000（平台兜底更宽）；
# tick_period_ms = 200 与 rrd watchdog tick 生产真值同源（rrd tick 环 200ms）；
# tick_jitter_ms / safety_core_interval_ms 为**声明预算位**（修订 2 ③）——
# 声明值与生产真值的对账归 0.0.6 点验矩阵，此处先按预算登记。
watchdog_present = true
watchdog_timeout_ms = 15000
watchdog_feeder = "rrd"
tick_period_ms = 200
tick_jitter_ms = 100
safety_core_interval_ms = 1000

[bindings]
# 格位 → 件。基础层（slots.toml layer=base）由基座内建承载，不在此绑定；
# 本节绑定全部身体层与认知层格位（16 格，default 机不留缺格）。
"act.servo" = "rr3-act"
"act.led" = "rr3-act"
"act.relay" = "rr3-act"
"net.wifi" = "rr3-connect"
"net.bt" = "rr3-connect"
"ui.face" = "rr3-interact"
"audio.playback" = "rr3-interact"
"audio.capture" = "rr3-sense"
"audio.vad" = "rr3-sense"
"sensor.env" = "rr3-sense"
"sensor.imu" = "rr3-sense"
"power.charger" = "rr3-power"
"cognition.dialog" = "rr3-brain"
"cognition.asr" = "rr3-brain"
"cognition.llm" = "rr3-brain"
"cognition.tts" = "rr3-brain"

[hardware]
# 物理绑定（ADR-0018 裁定 4、批D④ 收口）：引脚/控制器编号/总线/设备名的唯一
# 数据事实源——rrd 装配链读本段序列化注入 RR3_HAL_BINDINGS，rr-hal 据此实例化
# 后端；RR3_HAL_* env 降为应急覆盖；代码缺省 fail-closed，不回落任何一块板的
# 引脚。键位与 rr-hal 后端一一对应；取值 = 现参考机真值（R22 定案档
# pwmchip0/pwm0=GPIO12、R8 预算表 GPIO4/17 软件路行、接线 3 i2c1、BOM #5
# INA219@0x40、runbook 件 4 wlan0）。换板/换装配 = 只改本段，不改代码。
alsa_device = "default"
pwm_chip = 0
pwm_channel = 0
gpio_chip = 0
gpio_led_line = 4
gpio_relay_line = 17
i2c_bus = 1
ina219_addr = "0x40"
link_ifname = "wlan0"

[enabled_slots]
# 模块 → 本形态启用的格位集合。default 机各模块启用其 manifest provides 全集；
# 换机型裁剪模块能力面 = 只改本文件，不改代码。
rr3-act = ["act.servo", "act.led", "act.relay"]
rr3-connect = ["net.wifi", "net.bt"]
rr3-interact = ["ui.face", "audio.playback"]
rr3-sense = ["audio.capture", "audio.vad", "sensor.env", "sensor.imu"]
rr3-power = ["power.battery", "power.charger"]
rr3-brain = ["cognition.dialog", "cognition.asr", "cognition.llm", "cognition.tts"]

[slots]
# 本板物理在位格位声明（ADR-0018 修订 1 ④ 七段之一；缺格三源合一第一源——声明缺）。
# 基础层由基座内建承载、恒在位，不进本声明；参考机 16 格全在位，升序排列。
present = [
    "act.servo",
    "act.led",
    "act.relay",
    "audio.capture",
    "audio.playback",
    "audio.vad",
    "cognition.asr",
    "cognition.dialog",
    "cognition.llm",
    "cognition.tts",
    "net.bt",
    "net.wifi",
    "power.charger",
    "sensor.env",
    "sensor.imu",
    "ui.face",
]
