# RockRobot3 装配单：distro 机型（发行版快路轨，0.0.2 T5 / ADR-0013 裁定 3）
# 纯数据、零逻辑，门禁与 profiles/default.toml 完全同一套（ADR-0012 裁定 5② 查册门）。
# 快路 payload 含五个 Rust 模块 + Python brain（0.0.6 批F1 起：brain stdlib-only，
# 打包器按 lang=python 生成 shim 装机，判据"brain 随 deb 装机"）。0.0.2 时代四格
# 不绑定、brain 不进 boot 队列（缺格点名冒烟）——批F1 兑现后 cognition.* 绑定
# rr3-brain，随装配单进 boot 队列（CI distro-smoke 同步改断"六模块 spawn"）。
# schema_version = 2（0.0.5 批J，ADR-0018 修订 1 ④ 描述符七段定形）：三新段与
# default 同板同供给（[platform]/[supplies]/[slots] 逐值一致）。

schema_version = 2

[os]
route = "distro" # distro | buildroot（双轨见 ADR-0013）

[platform]
# 平台档位（ADR-0018 修订 1）：与 default 同一块参考机 = host。取值依据同 default 注释。
tier = "host"

[supplies]
# 平台供给声明：与 profiles/default.toml 同板同值（注释见 default——
# watchdog_timeout_ms 平台兜底、tick_period_ms 对齐 rrd tick 生产真值、
# 时序两位为声明预算位，对账归 0.0.6 点验矩阵）。
watchdog_present = true
watchdog_timeout_ms = 15000
watchdog_feeder = "rrd"
tick_period_ms = 200
tick_jitter_ms = 100
safety_core_interval_ms = 1000

[bindings]
# 格位 → 件。基础层（slots.toml layer=base）由基座内建承载，不在此绑定；
# 认知层四格绑定 rr3-brain（0.0.6 批F1：brain 随 deb 装机、经装配单进 boot）。
"act.servo" = "rr3-act"
"act.led" = "rr3-act"
"act.relay" = "rr3-act"
"net.wifi" = "rr3-connect"
"net.bt" = "rr3-connect"
"ui.face" = "rr3-interact"
"audio.playback" = "rr3-interact"
"audio.capture" = "rr3-sense"
"audio.vad" = "rr3-sense"
"sensor.env" = "rr3-sense"
"sensor.imu" = "rr3-sense"
"power.charger" = "rr3-power"
"cognition.dialog" = "rr3-brain"
"cognition.asr" = "rr3-brain"
"cognition.llm" = "rr3-brain"
"cognition.tts" = "rr3-brain"

[hardware]
# 物理绑定（ADR-0018 裁定 4、批D④ 收口）：键位与取值同 profiles/default.toml
# 注释（R22/R8/接线 3/BOM #5/runbook 件 4）；换板 = 只改本段，不改代码。
alsa_device = "default"
pwm_chip = 0
pwm_channel = 0
gpio_chip = 0
gpio_led_line = 4
gpio_relay_line = 17
i2c_bus = 1
ina219_addr = "0x40"
link_ifname = "wlan0"

[enabled_slots]
# 模块 → 本形态启用的格位集合。enabled_slots 决定起谁（Q3 裁定）。
rr3-act = ["act.servo", "act.led", "act.relay"]
rr3-connect = ["net.wifi", "net.bt"]
rr3-interact = ["ui.face", "audio.playback"]
rr3-sense = ["audio.capture", "audio.vad", "sensor.env", "sensor.imu"]
rr3-power = ["power.battery", "power.charger"]
rr3-brain = ["cognition.dialog", "cognition.asr", "cognition.llm", "cognition.tts"]

[slots]
# 本板物理在位格位声明：与 default 同一块板 = 16 格全在位，升序排列（注释见 default）。
present = [
    "act.servo",
    "act.led",
    "act.relay",
    "audio.capture",
    "audio.playback",
    "audio.vad",
    "cognition.asr",
    "cognition.dialog",
    "cognition.llm",
    "cognition.tts",
    "net.bt",
    "net.wifi",
    "power.charger",
    "sensor.env",
    "sensor.imu",
    "ui.face",
]
