# RockRobot3 装配单：pi4b-solo 机型（Pi 4B 单板全链，W5-1）
# 纯数据、零逻辑，门禁与 profiles/default.toml 完全同一套（ADR-0012 裁定 5② 查册门；
# 机型集 pin 在 rr-registry 契约测试，新增/删除本文件须同批改那条 pin 与形状测试）。
#
# 形态语义（ADR-0029 裁定 1）：Pi 4B 是**独立整机**——rrd + 六模块全部跑在本机，
# 本机 ALSA 采集、本机 USB 声卡回放、本机 sysfs PWM 舵机、本机 I2C OLED 表情。
# 与 pi4b-host 的差别不是"多一个板"，而是补齐全链缺的两格：
#   audio.capture / audio.vad（本机麦）与 act.servo（本机 pan 舵机）。
# pi4b-host-esp32-* 组合档继续作测试台架，不是本档的前身或上位形态。
#
# 判定边界（W5 验收）：
#   - 舵机面只要求 pan 单轴（DoA 左右转头）；tilt 不作 Pi 全链判据；
#   - 麦必须 ≥2 通道才能做 DoA；单声道输入只跑 ASR，不承诺听声识位；
#   - 显示面 = SSD1306 128x64 单色 OLED（I2C1，7-bit 从地址 0x3C，2026-11-22 真机
#     探测 ACK；W5-3 由 MAX7219 点阵换装而来，ui.face.i2c 角色登记）；
#   - host 档描述符单轴，正好承载 pan；双轴属 pi4b-board（rtos 板端点档）。
#
# schema_version = 5（与 default/distro 同版：[runtime] 段必填，缺即红）。

schema_version = 5

[os]
route = "distro" # Raspberry Pi OS（Debian 13 trixie 真机），发行版快路轨

[runtime]
log_ring_cap = 512
# 单板全链的 HAL 后端全在 linux：ALSA 采集/回放、sysfs PWM、I2C 显示、nmcli 链路。
hal_backend = "linux"

[platform]
# 完整 Linux 底座 + 六模块全跑在 Pi 上 = host 档（ADR-0018 修订 1）。
tier = "host"
# 平台事实表外键（§4.6）：contracts/platform/raspberry-pi-4.toml。
chip = "raspberry-pi-4"

[supplies]
# 平台供给声明：与 pi4b-host 同口径（看门狗三键 + 时序预算三位）。
watchdog_present = true
watchdog_timeout_ms = 15000
watchdog_feeder = "rrd"
tick_period_ms = 200
tick_jitter_ms = 100
safety_core_interval_ms = 1000

# [[supplies.domain]]：Pi 由官方 5V/3A 电源供电；舵机由独立 5V/3A UBEC 供电
# （禁接 Pi 5V，单点共地），故 rail5v 上限取 3000 mA；Pi 板载 3V3 轨只做声明位。
# 板侧无测点（ADS1115 读数归板侧程序），绑定引用位一律 "none"；未标定不武装。
[[supplies.domain]]
name = "rail5v"
nominal_mv = 5000
mild_mv = 4600
severe_mv = 4400
current_cap_ma = 3000
sense = "none"
current_sense = "none"
switch = "none"
switchable = false
armed = false
evidence = "none"
max_age_ms = 0

[[supplies.domain]]
name = "rail3v3"
nominal_mv = 3300
mild_mv = 3100
severe_mv = 3000
current_cap_ma = 600
sense = "none"
current_sense = "none"
switch = "none"
switchable = false
armed = false
evidence = "none"
max_age_ms = 0

# host 档校验⑩ 不适用，"合法不适用"显式写 true（F-6）。
[supplies.budget]
not_applicable = true

[bindings]
# 十格全链：采集/VAD、回放、表情、舵机、链路、认知四格。
# 不绑定 act.led / act.relay / power.*：本机未接线，不用虚构配置讨好装载门。
"act.servo" = "rr3-act"
"audio.capture" = "rr3-sense"
"audio.vad" = "rr3-sense"
"audio.playback" = "rr3-interact"
"ui.face" = "rr3-interact"
"net.wifi" = "rr3-connect"
"cognition.dialog" = "rr3-brain"
"cognition.asr" = "rr3-brain"
"cognition.llm" = "rr3-brain"
"cognition.tts" = "rr3-brain"

[hardware]
# 非引脚键直给（schema 3）：USB 声卡按 CARD 名指向（卡号随枚举变，名稳定），
# 采集与回放共用同一 ALSA 设备；网口 wlan0。
alsa_device = "plughw:CARD=Device"
link_ifname = "wlan0"

[[pin]]
# pan（水平）轴：pwmchip0 通道 0 → GPIO12 / pin 32（与 pi4b-board §9.2 接线同值）。
# host 档描述符是单轴；tilt 不登记（双轴属 rtos 板端点档）。
role = "act.axis.pwm"
instance = "pan"
controller = "pwm0"
channel = 0
physical = [12]
direction = "out"
rail = "rail5v"
failsafe = "release"
mux_group = []

[[pin]]
# SSD1306 OLED：i2c1（GPIO2/3）7-bit 从地址 0x3C，派生 i2c_bus=1 + oled_addr=0x3c
# （W5-3 显示面换装；型号词外键 → contracts/devices.toml 的 SSD1306 行）。
role = "ui.face.i2c"
controller = "i2c1"
addr = "0x3c"
device = "SSD1306"
direction = "out"
mux_group = []

[enabled_slots]
# 启用的格位集合（与 [bindings]/[slots] present 三处一致；缺格 fail-closed 拒启整模块）。
rr3-act = ["act.servo"]
rr3-connect = ["net.wifi"]
rr3-interact = ["ui.face", "audio.playback"]
rr3-sense = ["audio.capture", "audio.vad"]
rr3-brain = ["cognition.dialog", "cognition.asr", "cognition.llm", "cognition.tts"]

[slots]
# 本机物理在位格位声明（升序；十格与 [bindings] 键集逐项一致）。
present = [
    "act.servo",
    "audio.capture",
    "audio.playback",
    "audio.vad",
    "cognition.asr",
    "cognition.dialog",
    "cognition.llm",
    "cognition.tts",
    "net.wifi",
    "ui.face",
]
