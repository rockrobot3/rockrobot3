[package]
name = "rockrobot3-rust"
version = "0.1.0"
edition = "2021"

[dependencies]
esp-hal = { version = "1.2.2", features = ["esp32"] }
esp-println = { version = "0.18.0", features = ["esp32", "log"] }
esp-backtrace = { version = "0.20.0", features = ["esp32", "exception-handler", "panic-handler", "println"] }
log = "0.4"

[profile.dev]
opt-level = "z"

[profile.release]
opt-level = "s"
codegen-units = 1
lto = "fat"
debug = true
