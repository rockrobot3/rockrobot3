# 与 tools/espidf-sentinel/.cargo/config.toml 同款（批W1 钉死登记，版本对表见
# tools/espidf-std-hello/README.md）：xtensa-esp32-espidf std 目标 + build-std +
# ldproxy + espidf_time64 + MCU=esp32。
#
# W1/T2 双芯片档：同一 crate 同时支持 classic 与 S3 N16R8。默认 `[build]` 仍是
# classic（既有 runbook 不变）；S3 构建显式给 target、MCU 与芯片档 feature：
#   MCU=esp32s3 cargo +esp build --target xtensa-esp32s3-espidf \
#       --no-default-features --features esp32s3
# 芯片档必须走 Cargo feature（esp-idf-sys 的 `cargo:rustc-cfg=esp32*` 不跨 crate
# 传播，本 crate 内 `cfg(esp32*)` 恒假）。`[env]` 的 MCU=esp32 未设 force，外部
# env 优先；esp-idf-sys 会按 MCU 自动选用 sdkconfig.defaults.esp32s3
# （BUILD-OPTIONS.md：<path>.<mcu> 更具体者覆盖）。
#
# runner = espflash（0.0.7 方案 §9.3 ① 的 runner=espflash 口径）：`cargo +esp run`
# = 烧录 + monitor（退出键 Ctrl+]）。espflash 4.x 与 espidf std 镜像兼容——std 路
# 经 ESP-IDF 构建自带 app descriptor（批C④ 的 esp-hal 裸金属缺 appdesc 补丁不适用
# 本工程）。espflash 4.x 硬校验 app descriptor，本工程 espidf 面自始自带，无
# esp32-uart-echo 批C④ 现场补丁同款问题。runner 必须挂 target 级（[build] runner
# 在本 cargo 下报 unused key）。
[build]
target = "xtensa-esp32-espidf"

[target.xtensa-esp32-espidf]
linker = "ldproxy"
runner = "espflash flash --monitor"
# esp-idf-sys BUILD-OPTIONS：IDF 5.0+ 必设（libc time_t 64 位面与 C 头对齐）
rustflags = ["--cfg", "espidf_time64"]

# ESP32-S3 N16R8（8MB Octal PSRAM）。runner 与 rustflags 同 classic；
# 芯片差异走 MCU env + sdkconfig.defaults.esp32s3。
[target.xtensa-esp32s3-espidf]
linker = "ldproxy"
runner = "espflash flash --monitor"
rustflags = ["--cfg", "espidf_time64"]

[unstable]
build-std = ["std", "panic_abort"]
build-std-features = ["panic_immediate_abort"]

# MCU 必须显式（esp-idf-sys 据此选 IDF 工具链与目标）。
[env]
MCU = "esp32"
# 离线构建钉（2026-10-20）：esp-idf-sys 0.35.0 build.rs 每次 rerun 都对 managed
# esp-idf 仓库跑 `git remote show origin`（cargo_driver.rs patch 集判定用，v5.2.x
# 实为 NO_PATCHES 纯浪费）——github 不通时构建即炸。设 IDF_PATH 指向本地框架仓库
# 走 Custom 路径，该网络调用整段跳过（Custom 不进 patch 判定；对 cmake 缓存零影响
# ——缓存本就绑定此路径）。实测离线 5m10s 过。路径为本机绝对路径（单人单机工程，
# 换机需同步改）。验证法：断网重跑 `cargo +esp build` 应无 git 网络报错。
IDF_PATH = "/Users/apple/.espressif/frameworks/esp-idf-v5.2.2"
