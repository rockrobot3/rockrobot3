[package]
name = "esp32-periph-base"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "UNLICENSED"
publish = false
description = "0.0.5 增补轮五 批B 外设底座档（espidf std：SSD1306 OLED + LEDC 双轴舵机 + UART2 行指令面）"

# 独立 workspace：xtensa-esp32-espidf 目标 + build-std 与 base/runtime 主 workspace 互斥，
# 门禁 ④/⑥ 的宿主 check/test 不扫本目录（check.sh 显式排除；编译走
# tools/ci/esp32-periph-base-check.sh，工具链缺位 SKIP 纪律同 espidf-sentinel-check.sh）。
# 批B 不进城（不依赖 rr-ipc/rr-core/serde_json）——批C 在本 crate 上加哨兵面同 crate 渐进
# （全案 §4：批B/批D 板上固件同一档分批合入）。
[workspace]

[dependencies]
# 版本组合对表批W1 钉死登记（tools/espidf-std-hello/README.md）：
# esp-idf-sys =0.35.0 ↔ ESP-IDF v5.2.2 ↔ embuild =0.32.0 ↔ ldproxy 0.3.5。
esp-idf-sys = { version = "=0.35.0", features = ["binstart"] }
# I2C（SSD1306）与 LEDC（舵机 PWM）驱动：esp-idf-hal 0.44.x 与 esp-idf-sys 0.35
# 同代（其 Cargo.toml 依赖 esp-idf-sys ^0.35），精确 pin 保版本组合可复现。
esp-idf-hal = "=0.44.1"

[build-dependencies]
# 链接参数接力（同 espidf-sentinel build.rs 注释）：esp-idf-sys 的
# cargo:rustc-link-arg 只作用于它自己包内 bins 面，根 crate 必须经 links 元数据
# （DEP_ESP_IDF_EMBUILD_LINK_ARGS）自行取回并转发。
embuild = "=0.32.0"

