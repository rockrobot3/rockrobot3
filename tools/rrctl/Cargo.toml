[package]
name = "rr3-ctl"
version = "0.0.1"
edition = "2021"
rust-version = "1.82"
license = "Apache-2.0"
publish = false
description = "总线侧运维 CLI：查在册模块、看健康状态、取日志、触发 OTA（ota 随 M6）"

# 独立工程：tools/ 不在 base/runtime workspace 内（与 rr3-mkmod 同构）
[workspace]

[[bin]]
name = "rr3-ctl"
path = "src/main.rs"

[dependencies]
rr-bus = { path = "../../base/runtime/rr-bus" }
rr-bus-api = { path = "../../base/runtime/rr-bus-api" }
rr-ipc = { path = "../../base/runtime/rr-ipc" }
serde_json = "1"

# 生产稳定性：release 档也开算术溢出检查——静默回绕是最难定位的缺陷；
# 代价是个位数百分比性能，换"溢出即 panic 可定位"。
[profile.release]
overflow-checks = true
